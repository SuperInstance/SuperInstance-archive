      - name: api-gateway
        image: activelog/api-gateway:v1.1.0-rc1
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8081
          name: metrics
        env:
        - name: DEPLOYMENT_TYPE
          value: "canary"
        - name: VERSION
          value: "v1.1.0-rc1"
        - name: CONSUL_HOST
          value: "consul-server"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: activelog
  labels:
    app: api-gateway
    version: stable
spec:
  selector:
    app: api-gateway
    version: stable
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: metrics
    port: 8081
    targetPort: 8081
