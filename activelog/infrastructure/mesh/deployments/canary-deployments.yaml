apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-stable
  namespace: activelog
  labels:
    app: api-gateway
    version: stable
    deployment: canary
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
      version: stable
  template:
    metadata:
      labels:
        app: api-gateway
        version: stable
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/service-meta-version: "stable"
        consul.hashicorp.com/service-tags: "activelog,gateway,api,stable"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-gateway
        image: activelog/api-gateway:v1.0.0
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8081
          name: metrics
        env:
        - name: DEPLOYMENT_TYPE
          value: "stable"
        - name: VERSION
          value: "v1.0.0"
        - name: CONSUL_HOST
          value: "consul-server"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-canary
  namespace: activelog
  labels:
    app: api-gateway
    version: canary
