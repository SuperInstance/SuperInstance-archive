# Auth Service Canary Deployments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-stable
  namespace: activelog
  labels:
    app: auth-service
    version: stable
    deployment: canary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
      version: stable
  template:
    metadata:
      labels:
        app: auth-service
        version: stable
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/service-meta-version: "stable"
        consul.hashicorp.com/service-tags: "activelog,auth,security,stable"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: auth-service
        image: activelog/auth-service:v1.0.0
        ports:
        - containerPort: 8001
          name: http
        - containerPort: 8081
          name: metrics
        env:
        - name: DEPLOYMENT_TYPE
          value: "stable"
        - name: VERSION
          value: "v1.0.0"
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
