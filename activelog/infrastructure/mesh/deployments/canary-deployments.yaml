# Weighted routing service that combines stable and canary
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: activelog
  labels:
    app: auth-service
  annotations:
    consul.hashicorp.com/service-name: "auth-service"
    consul.hashicorp.com/service-port: "8001"
    consul.hashicorp.com/service-meta-canary-enabled: "true"
spec:
  selector:
    app: auth-service
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  - name: metrics
    port: 8081
    targetPort: 8081
---
