# AWS Application Load Balancer Configuration for ActiveLog Domains
# Creates load balancers for all 11 domains with auto-scaling and health checks

AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Load Balancers for ActiveLog Domains'

Parameters:
  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for load balancers
  
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for load balancers
  
  CertificateArn:
    Type: String
    Description: SSL Certificate ARN for HTTPS
    Default: "arn:aws:acm:us-east-1:123456789012:certificate/example"

Resources:
  # Security Group for Load Balancers
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ActiveLog load balancers
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: activelog-lb-security-group

  # PersonalLog Load Balancer
  PersonalLogLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: personallog-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Domain
          Value: PersonalLog

  PersonalLogTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: personallog-targets
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPCId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetType: instance

  PersonalLogListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PersonalLogTargetGroup
      LoadBalancerArn: !Ref PersonalLogLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn

  # MakerLog Load Balancer
