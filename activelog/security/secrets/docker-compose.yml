version: '3.8'

services:
  secrets-rotation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activelog-secrets-rotation
    ports:
      - "8087:8087"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=activelog_secrets
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=2
      - VAULT_URL=${VAULT_URL:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./configs:/app/configs:ro
      - secrets_data:/tmp
    depends_on:
      - postgres
      - redis
      - vault
    networks:
      - secrets_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/api/v1/secrets/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: activelog-secrets-db
    environment:
      - POSTGRES_DB=activelog_secrets
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - secrets_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: activelog-secrets-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - secrets_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  vault:
    image: hashicorp/vault:latest
    container_name: activelog-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-activelog-dev-token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./vault/policies:/vault/policies:ro
    networks:
      - secrets_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 5s
      retries: 3

  secrets-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: activelog-secrets-ui
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8087
    depends_on:
      - secrets-rotation
    networks:
      - secrets_network
    restart: unless-stopped

  secrets-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: activelog-secrets-scheduler
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=activelog_secrets
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - REDIS_HOST=redis
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    volumes:
      - ./configs:/app/configs:ro
      - secrets_data:/tmp
    depends_on:
      - postgres
      - redis
      - vault
    networks:
      - secrets_network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: activelog-notifications
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=activelog_secrets
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      - postgres
    networks:
      - secrets_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  vault_logs:
    driver: local
  secrets_data:
    driver: local

networks:
  secrets_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16