# ActiveLog Secrets Rotation Configuration

service:
  name: "activelog-secrets-rotation"
  version: "1.0.0"
  port: 8087
  host: "0.0.0.0"
  log_level: "INFO"

database:
  host: "${POSTGRES_HOST:-localhost}"
  port: 5432
  name: "activelog_secrets"
  user: "${POSTGRES_USER:-postgres}"
  password: "${POSTGRES_PASSWORD:-password}"
  pool_size: 20
  max_overflow: 0
  pool_timeout: 30
  connection_timeout: 10

redis:
  host: "${REDIS_HOST:-localhost}"
  port: 6379
  db: 2
  password: "${REDIS_PASSWORD:-}"
  socket_timeout: 5
  socket_connect_timeout: 5
  retry_on_timeout: true
  max_connections: 50

vault:
  url: "${VAULT_URL:-http://localhost:8200}"
  token: "${VAULT_TOKEN:-}"
  mount_point: "secret"
  verify_ssl: false
  timeout: 30

aws:
  region: "${AWS_DEFAULT_REGION:-us-east-1}"
  access_key_id: "${AWS_ACCESS_KEY_ID:-}"
  secret_access_key: "${AWS_SECRET_ACCESS_KEY:-}"
  secrets_manager:
    kms_key_id: "${AWS_KMS_KEY_ID:-alias/aws/secretsmanager}"

encryption:
  algorithm: "fernet"
  key_rotation_days: 365
  backup_keys: 3

rotation:
  default_interval_days: 30
  max_interval_days: 365
  min_interval_days: 1
  backup_versions: 3
  notification_hours_before_expiry: 24
  batch_size: 10
  max_concurrent_rotations: 5
  rotation_timeout_seconds: 300
  retry_attempts: 3
  retry_delay_seconds: 30

scheduler:
  rotation_check_cron: "0 * * * *"  # Every hour
  notification_check_cron: "0 */6 * * *"  # Every 6 hours
  cleanup_cron: "0 2 * * *"  # Daily at 2 AM
  metrics_export_cron: "*/5 * * * *"  # Every 5 minutes

notification:
  enabled: true
  channels:
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL:-}"
      channel: "#security-alerts"
      username: "SecretBot"
    email:
      enabled: true
      smtp_host: "${EMAIL_SMTP_HOST:-}"
      smtp_port: 587
      username: "${EMAIL_USERNAME:-}"
      password: "${EMAIL_PASSWORD:-}"
      from_address: "${EMAIL_FROM:-noreply@activelog.com}"
      to_addresses: 
        - "security@activelog.com"
        - "ops@activelog.com"
    pagerduty:
      enabled: false
      integration_key: "${PAGERDUTY_INTEGRATION_KEY:-}"

secrets:
  types:
    database_password:
      length: 32
      characters: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
      exclude_ambiguous: true
    api_key:
      length: 32
      format: "urlsafe_base64"
    jwt_secret:
      length: 64
      format: "urlsafe_base64"
    encryption_key:
      format: "fernet_key"
    password:
      length: 24
      characters: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*"
      require_uppercase: true
      require_lowercase: true
      require_numbers: true
      require_symbols: true

security:
  api_key_required: true
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst: 20
  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3001"
      - "https://admin.activelog.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
  audit_logging:
    enabled: true
    log_all_requests: true
    log_request_body: false
    sensitive_fields:
      - "password"
      - "secret"
      - "token"
      - "key"

monitoring:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  health_check:
    enabled: true
    path: "/health"
    interval_seconds: 30
  tracing:
    enabled: true
    jaeger_endpoint: "http://jaeger:14268/api/traces"
    sampling_rate: 0.1

environments:
  production:
    external_services:
      - vault
      - aws_secrets_manager
    notification_channels:
      - slack
      - email
      - pagerduty
  staging:
    external_services:
      - vault
    notification_channels:
      - slack
  development:
    external_services: []
    notification_channels: []

compliance:
  audit_retention_days: 2555  # 7 years
  rotation_history_retention_days: 1095  # 3 years
  notification_log_retention_days: 90
  gdpr:
    enabled: true
    data_retention_days: 2555
  sox:
    enabled: true
    require_dual_approval: true
  pci:
    enabled: true
    key_rotation_days: 30