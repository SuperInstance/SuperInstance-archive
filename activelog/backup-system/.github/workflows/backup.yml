name: Automated Backup System

on:
  push:
    branches: [ main, master ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Type of backup to create'
        required: true
        default: 'scheduled'
        type: choice
        options:
        - scheduled
        - manual
        - release
      notification:
        description: 'Send notifications'
        required: false
        default: true
        type: boolean

env:
  BACKUP_RETENTION_DAYS: 30
  MAX_BACKUP_SIZE_GB: 2
  CHUNK_SIZE_MB: 950

jobs:
  calculate-backup-strategy:
    name: Calculate Backup Strategy
    runs-on: ubuntu-latest
    outputs:
      backup_size_mb: ${{ steps.analyze.outputs.backup_size_mb }}
      needs_splitting: ${{ steps.analyze.outputs.needs_splitting }}
      chunk_count: ${{ steps.analyze.outputs.chunk_count }}
      backup_id: ${{ steps.analyze.outputs.backup_id }}
      skip_backup: ${{ steps.analyze.outputs.skip_backup }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up backup tools
      run: |
        sudo apt-get update
        sudo apt-get install -y jq tar gzip gettext-base
        
    - name: Analyze project for backup
      id: analyze
      run: |
        echo "Analyzing project for backup strategy..."
        
        # Generate backup ID
        BACKUP_ID="activelog_$(date '+%Y%m%d_%H%M%S')_$(git rev-parse --short HEAD)"
        echo "backup_id=$BACKUP_ID" >> $GITHUB_OUTPUT
        
        # Calculate project size (excluding patterns from config)
        if [[ -f "backup-system/backup_config.json" ]]; then
          # Create exclusion file from config
          jq -r '.exclusion_patterns[]' backup-system/backup_config.json > /tmp/exclusions.txt
        else
          # Fallback exclusions
          cat > /tmp/exclusions.txt << 'EOF'
        node_modules/
        .git/objects/
        .git/logs/
        *.log
        *.tmp
        .DS_Store
        coverage/
        dist/
        build/
        .cache/
        .next/
        target/
        __pycache__/
        .venv/
        EOF
        fi
        
        # Calculate size
        SIZE_BYTES=$(tar --exclude-from=/tmp/exclusions.txt -czf /dev/null . 2>/dev/null; du -sb . | cut -f1)
        SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
        
        echo "Project size: ${SIZE_MB} MB"
        echo "backup_size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
        
        # Check if backup should be skipped (too large)
        if [[ $SIZE_MB -gt $((MAX_BACKUP_SIZE_GB * 1024)) ]]; then
          echo "Project size exceeds maximum allowed size (${MAX_BACKUP_SIZE_GB}GB)"
          echo "skip_backup=true" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "skip_backup=false" >> $GITHUB_OUTPUT
        
        # Determine if splitting is needed
        if [[ $SIZE_MB -gt $CHUNK_SIZE_MB ]]; then
          CHUNK_COUNT=$(((SIZE_MB + CHUNK_SIZE_MB - 1) / CHUNK_SIZE_MB))
          echo "needs_splitting=true" >> $GITHUB_OUTPUT
          echo "chunk_count=$CHUNK_COUNT" >> $GITHUB_OUTPUT
          echo "Backup will be split into $CHUNK_COUNT chunks"
        else
          echo "needs_splitting=false" >> $GITHUB_OUTPUT
          echo "chunk_count=1" >> $GITHUB_OUTPUT
          echo "Single backup archive will be created"
        fi
        
    - name: Check for recent backups
      id: recent-check
      run: |
        echo "Checking for recent backups..."
        
        # Get latest release
        LATEST_RELEASE=$(gh release list --limit 1 --json tagName,createdAt || echo "[]")
        
        if [[ "$LATEST_RELEASE" != "[]" ]]; then
          LATEST_TAG=$(echo "$LATEST_RELEASE" | jq -r '.[0].tagName // empty')
          LATEST_DATE=$(echo "$LATEST_RELEASE" | jq -r '.[0].createdAt // empty')
          
          if [[ -n "$LATEST_TAG" && "$LATEST_TAG" =~ ^backup- ]]; then
            # Calculate hours since last backup
            LATEST_EPOCH=$(date -d "$LATEST_DATE" +%s)
            CURRENT_EPOCH=$(date +%s)
            HOURS_DIFF=$(( (CURRENT_EPOCH - LATEST_EPOCH) / 3600 ))
            
            echo "Last backup: $LATEST_TAG ($HOURS_DIFF hours ago)"
            
            # Skip if recent backup exists and this is not manual
            if [[ $HOURS_DIFF -lt 12 && "${{ github.event_name }}" == "push" ]]; then
              echo "Recent backup exists, skipping automatic backup"
              echo "skip_backup=true" >> $GITHUB_OUTPUT
            fi
          fi
        fi
        
        echo "skip_backup=false" >> $GITHUB_OUTPUT
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-backup:
    name: Create Backup
    runs-on: ubuntu-latest
    needs: calculate-backup-strategy
    if: needs.calculate-backup-strategy.outputs.skip_backup != 'true'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up backup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y jq tar gzip gettext-base tree
        
        # Create working directory
        mkdir -p /tmp/backup-workspace
        cd /tmp/backup-workspace
        
        echo "Backup environment ready"
        echo "BACKUP_WORKSPACE=/tmp/backup-workspace" >> $GITHUB_ENV
        
    - name: Create exclusion patterns
      run: |
        echo "Creating exclusion patterns..."
        
        if [[ -f "backup-system/backup_config.json" ]]; then
          jq -r '.exclusion_patterns[]' backup-system/backup_config.json > $BACKUP_WORKSPACE/exclusions.txt
        else
          cat > $BACKUP_WORKSPACE/exclusions.txt << 'EOF'
        node_modules/
        .git/objects/
        .git/logs/
        *.log
        *.tmp
        .DS_Store
        Thumbs.db
        coverage/
        dist/
        build/
        .cache/
        .next/
        .nuxt/
        target/
        *.class
        __pycache__/
        .venv/
        .env.local
        .env.development
        .env.production
        .backup/
        backup-*/
        .terraform/
        terraform.tfstate*
        .vagrant/
        *.pid
        .nyc_output/
        .sass-cache/
        typings/
        .npm/
        .eslintcache
        .rpt2_cache*/
        .node_repl_history
        *.tsbuildinfo
        .vscode/settings.json
        .idea/workspace.xml
        .metadata/
        bin/
        tmp/
        EOF
        fi
        
        # Add dynamic exclusions
        echo "backup-system/" >> $BACKUP_WORKSPACE/exclusions.txt
        echo ".github/workflows/backup.yml" >> $BACKUP_WORKSPACE/exclusions.txt
        
        echo "Exclusion patterns created ($(wc -l < $BACKUP_WORKSPACE/exclusions.txt) patterns)"
        
    - name: Create backup manifest
      id: manifest
      run: |
        echo "Creating backup manifest..."
        
        BACKUP_ID="${{ needs.calculate-backup-strategy.outputs.backup_id }}"
        
        # Get git information
        GIT_COMMIT=$(git rev-parse HEAD)
        GIT_SHORT=$(git rev-parse --short HEAD)
        GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo 'none')
        GIT_DIRTY=$(if git diff-index --quiet HEAD --; then echo 'false'; else echo 'true'; fi)
        
        # Create manifest
        cat > $BACKUP_WORKSPACE/manifest.json << EOF
        {
          "backup_id": "$BACKUP_ID",
          "timestamp": "$(date '+%Y%m%d_%H%M%S')",
          "iso_timestamp": "$(date -Iseconds)",
          "project_name": "activelog",
          "version": "1.0",
          "size_mb": ${{ needs.calculate-backup-strategy.outputs.backup_size_mb }},
          "chunk_count": ${{ needs.calculate-backup-strategy.outputs.chunk_count }},
          "compression": "gzip",
          "compression_level": 6,
          "git": {
            "commit": "$GIT_COMMIT",
            "commit_short": "$GIT_SHORT",
            "branch": "$GIT_BRANCH",
            "tag": "$GIT_TAG",
            "dirty": $GIT_DIRTY
          },
          "github": {
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}",
            "event_name": "${{ github.event_name }}",
            "ref": "${{ github.ref }}"
          },
          "system": {
            "runner": "github-actions",
            "os": "ubuntu-latest",
            "architecture": "x64"
          },
          "files": []
        }
        EOF
        
        echo "manifest_file=$BACKUP_WORKSPACE/manifest.json" >> $GITHUB_OUTPUT
        echo "Manifest created for backup: $BACKUP_ID"
        
    - name: Create backup archive(s)
      id: create-archive
      run: |
        echo "Creating backup archive(s)..."
        
        cd $GITHUB_WORKSPACE
        
        if [[ "${{ needs.calculate-backup-strategy.outputs.needs_splitting }}" == "true" ]]; then
          echo "Creating split backup..."
          
          # Create compressed tar and split it
          tar --exclude-from=$BACKUP_WORKSPACE/exclusions.txt -czf - . | \
            split -b ${CHUNK_SIZE_MB}M -d --suffix-length=3 - $BACKUP_WORKSPACE/activelog_backup_
          
          # Count and process chunks
          CHUNKS=($BACKUP_WORKSPACE/activelog_backup_*)
          CHUNK_COUNT=${#CHUNKS[@]}
          
          echo "Created $CHUNK_COUNT chunks"
          
          # Update manifest with chunk information
          for chunk in "${CHUNKS[@]}"; do
            CHUNK_NAME=$(basename "$chunk")
            CHUNK_SIZE=$(stat -c%s "$chunk")
            CHUNK_CHECKSUM=$(sha256sum "$chunk" | cut -d' ' -f1)
            
            # Add to manifest
            jq --arg name "$CHUNK_NAME" \
               --arg checksum "$CHUNK_CHECKSUM" \
               --argjson size "$CHUNK_SIZE" \
               '.files += [{"name": $name, "checksum": $checksum, "size": $size, "type": "chunk"}]' \
               $BACKUP_WORKSPACE/manifest.json > $BACKUP_WORKSPACE/manifest.json.tmp
            mv $BACKUP_WORKSPACE/manifest.json.tmp $BACKUP_WORKSPACE/manifest.json
            
            echo "Chunk: $CHUNK_NAME ($(numfmt --to=iec-i --suffix=B $CHUNK_SIZE))"
          done
          
        else
          echo "Creating single backup..."
          
          # Create single compressed archive
          tar --exclude-from=$BACKUP_WORKSPACE/exclusions.txt \
              -czf $BACKUP_WORKSPACE/activelog_backup.tar.gz .
          
          # Get file info
          ARCHIVE_SIZE=$(stat -c%s $BACKUP_WORKSPACE/activelog_backup.tar.gz)
          ARCHIVE_CHECKSUM=$(sha256sum $BACKUP_WORKSPACE/activelog_backup.tar.gz | cut -d' ' -f1)
          
          # Update manifest
          jq --arg name "activelog_backup.tar.gz" \
             --arg checksum "$ARCHIVE_CHECKSUM" \
             --argjson size "$ARCHIVE_SIZE" \
             '.files += [{"name": $name, "checksum": $checksum, "size": $size, "type": "single"}]' \
             $BACKUP_WORKSPACE/manifest.json > $BACKUP_WORKSPACE/manifest.json.tmp
          mv $BACKUP_WORKSPACE/manifest.json.tmp $BACKUP_WORKSPACE/manifest.json
          
          echo "Archive: activelog_backup.tar.gz ($(numfmt --to=iec-i --suffix=B $ARCHIVE_SIZE))"
        fi
        
        # Finalize manifest
        jq --argjson count ${{ needs.calculate-backup-strategy.outputs.chunk_count }} \
           '.chunk_count = $count' \
           $BACKUP_WORKSPACE/manifest.json > $BACKUP_WORKSPACE/manifest.json.tmp
        mv $BACKUP_WORKSPACE/manifest.json.tmp $BACKUP_WORKSPACE/manifest.json
        
        echo "Backup creation completed"
        
    - name: Validate backup integrity
      run: |
        echo "Validating backup integrity..."
        
        VALIDATION_ERRORS=0
        FILE_COUNT=$(jq -r '.files | length' $BACKUP_WORKSPACE/manifest.json)
        
        echo "Validating $FILE_COUNT files..."
        
        for ((i=0; i<FILE_COUNT; i++)); do
          FILE_NAME=$(jq -r ".files[$i].name" $BACKUP_WORKSPACE/manifest.json)
          EXPECTED_CHECKSUM=$(jq -r ".files[$i].checksum" $BACKUP_WORKSPACE/manifest.json)
          FILE_PATH="$BACKUP_WORKSPACE/$FILE_NAME"
          
          if [[ ! -f "$FILE_PATH" ]]; then
            echo "❌ Missing file: $FILE_NAME"
            ((VALIDATION_ERRORS++))
            continue
          fi
          
          ACTUAL_CHECKSUM=$(sha256sum "$FILE_PATH" | cut -d' ' -f1)
          
          if [[ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]]; then
            echo "❌ Checksum mismatch for $FILE_NAME"
            ((VALIDATION_ERRORS++))
          else
            echo "✅ $FILE_NAME"
          fi
        done
        
        if [[ $VALIDATION_ERRORS -eq 0 ]]; then
          echo "✅ Backup integrity validation passed"
        else
          echo "❌ Backup integrity validation failed with $VALIDATION_ERRORS errors"
          exit 1
        fi
        
    - name: Upload to AWS S3
      if: env.AWS_ACCESS_KEY_ID != ''
      run: |
        echo "Uploading backup to S3..."
        
        # Configure AWS CLI
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set default.region ${{ vars.AWS_REGION || 'us-east-1' }}
        
        BUCKET="${{ vars.S3_BACKUP_BUCKET }}"
        PREFIX="activelog-backups/"
        BACKUP_ID="${{ needs.calculate-backup-strategy.outputs.backup_id }}"
        
        if [[ -n "$BUCKET" ]]; then
          echo "Uploading to s3://$BUCKET/$PREFIX$BACKUP_ID/"
          
          for file in $BACKUP_WORKSPACE/*; do
            if [[ -f "$file" ]]; then
              FILE_NAME=$(basename "$file")
              S3_KEY="${PREFIX}${BACKUP_ID}/${FILE_NAME}"
              
              echo "Uploading: $FILE_NAME"
              aws s3 cp "$file" "s3://$BUCKET/$S3_KEY" \
                --storage-class STANDARD_IA \
                --no-progress
            fi
          done
          
          echo "✅ S3 upload completed"
          echo "S3_UPLOAD_SUCCESS=true" >> $GITHUB_ENV
        else
          echo "⚠️ S3 bucket not configured, skipping S3 upload"
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        
    - name: Create GitHub Release
      id: create-release
      run: |
        echo "Creating GitHub release..."
        
        BACKUP_ID="${{ needs.calculate-backup-strategy.outputs.backup_id }}"
        RELEASE_TAG="backup-$(date '+%Y%m%d_%H%M%S')"
        
        # Create release notes
        cat > /tmp/release_notes.md << EOF
        # 🗄️ Automated Backup - $(date '+%Y-%m-%d %H:%M:%S UTC')
        
        ## Backup Information
        - **Backup ID**: \`$BACKUP_ID\`
        - **Project Size**: ${{ needs.calculate-backup-strategy.outputs.backup_size_mb }} MB
        - **Chunks**: ${{ needs.calculate-backup-strategy.outputs.chunk_count }}
        - **Commit**: [\`$(git rev-parse --short HEAD)\`](../../commit/$(git rev-parse HEAD))
        - **Branch**: \`$(git rev-parse --abbrev-ref HEAD)\`
        - **Triggered by**: ${{ github.event_name }}
        
        ## 📦 Backup Contents
        This automated backup includes:
        - All source code and configuration files
        - Documentation and README files
        - Project configuration (package.json, requirements.txt, etc.)
        - Database schemas and migrations
        - Essential project assets
        
        ## 🔧 Restoration
        To restore this backup:
        1. Download all backup files from this release
        2. Use the provided \`restore.sh\` script from the backup-system
        3. Or manually extract: \`cat activelog_backup_* | tar -xzf -\`
        
        ## ✅ Integrity Verification
        All backup files have been validated with SHA-256 checksums.
        See \`manifest.json\` for detailed file information.
        
        ---
        *This backup was created automatically by the ActiveLog backup system.*
        EOF
        
        # Create release
        gh release create "$RELEASE_TAG" \
          --title "Automated Backup - $(date '+%Y-%m-%d %H:%M:%S')" \
          --notes-file /tmp/release_notes.md \
          --target main
        
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        echo "✅ Release created: $RELEASE_TAG"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload backup files to release
      run: |
        echo "Uploading backup files to GitHub release..."
        
        RELEASE_TAG="${{ steps.create-release.outputs.release_tag }}"
        UPLOAD_COUNT=0
        
        for file in $BACKUP_WORKSPACE/*; do
          if [[ -f "$file" ]]; then
            FILE_NAME=$(basename "$file")
            FILE_SIZE=$(stat -c%s "$file")
            
            echo "Uploading: $FILE_NAME ($(numfmt --to=iec-i --suffix=B $FILE_SIZE))"
            
            # Upload with retry logic
            for attempt in {1..3}; do
              if gh release upload "$RELEASE_TAG" "$file" --clobber; then
                echo "✅ Uploaded: $FILE_NAME"
                ((UPLOAD_COUNT++))
                break
              else
                echo "⚠️ Upload attempt $attempt failed for $FILE_NAME"
                if [[ $attempt -eq 3 ]]; then
                  echo "❌ Failed to upload: $FILE_NAME after 3 attempts"
                fi
                sleep 5
              fi
            done
          fi
        done
        
        echo "✅ Upload completed: $UPLOAD_COUNT files"
        echo "UPLOAD_COUNT=$UPLOAD_COUNT" >> $GITHUB_ENV
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Clean up old releases
      run: |
        echo "Cleaning up old backup releases..."
        
        # Keep only the last 10 backup releases
        BACKUP_RELEASES=$(gh release list --json tagName,createdAt \
          | jq -r '.[] | select(.tagName | startswith("backup-")) | .tagName' \
          | head -n +10)
        
        ALL_BACKUP_RELEASES=$(gh release list --json tagName \
          | jq -r '.[] | select(.tagName | startswith("backup-")) | .tagName')
        
        # Delete releases not in the keep list
        for release in $ALL_BACKUP_RELEASES; do
          if ! echo "$BACKUP_RELEASES" | grep -q "^$release$"; then
            echo "Deleting old release: $release"
            gh release delete "$release" --yes || true
          fi
        done
        
        echo "✅ Old releases cleaned up"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Send notification
      if: always() && (inputs.notification == true || inputs.notification == '')
      run: |
        echo "Sending backup completion notification..."
        
        # Determine status
        if [[ "${{ job.status }}" == "success" ]]; then
          STATUS="✅ SUCCESS"
          COLOR="good"
        else
          STATUS="❌ FAILED"
          COLOR="danger"
        fi
        
        # Prepare notification payload
        BACKUP_ID="${{ needs.calculate-backup-strategy.outputs.backup_id }}"
        SIZE_MB="${{ needs.calculate-backup-strategy.outputs.backup_size_mb }}"
        CHUNKS="${{ needs.calculate-backup-strategy.outputs.chunk_count }}"
        
        PAYLOAD=$(cat << EOF
        {
          "text": "ActiveLog Backup Notification",
          "attachments": [
            {
              "color": "$COLOR",
              "fields": [
                {
                  "title": "Status",
                  "value": "$STATUS",
                  "short": true
                },
                {
                  "title": "Backup ID",
                  "value": "$BACKUP_ID",
                  "short": true
                },
                {
                  "title": "Size",
                  "value": "${SIZE_MB} MB",
                  "short": true
                },
                {
                  "title": "Chunks",
                  "value": "$CHUNKS",
                  "short": true
                },
                {
                  "title": "Repository",
                  "value": "${{ github.repository }}",
                  "short": false
                }
              ],
              "footer": "ActiveLog Backup System",
              "ts": $(date +%s)
            }
          ]
        }
        EOF
        )
        
        # Send to webhook if configured
        if [[ -n "${{ secrets.BACKUP_WEBHOOK_URL }}" ]]; then
          curl -X POST "${{ secrets.BACKUP_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
        fi
        
        echo "📨 Notification sent"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Generate backup report
      if: always()
      run: |
        echo "Generating backup report..."
        
        cat > $GITHUB_STEP_SUMMARY << 'EOF'
        # 🗄️ Backup Report
        
        ## Summary
        - **Status**: ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
        - **Backup ID**: `${{ needs.calculate-backup-strategy.outputs.backup_id }}`
        - **Size**: ${{ needs.calculate-backup-strategy.outputs.backup_size_mb }} MB
        - **Chunks**: ${{ needs.calculate-backup-strategy.outputs.chunk_count }}
        - **Release**: ${{ steps.create-release.outputs.release_tag }}
        
        ## Files Uploaded
        - GitHub Release: ${{ env.UPLOAD_COUNT || '0' }} files
        - AWS S3: ${{ env.S3_UPLOAD_SUCCESS == 'true' && '✅ Success' || '⚠️ Skipped' }}
        
        ## Next Steps
        - Backup files are available in the [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.create-release.outputs.release_tag }})
        - Use `restore.sh` from backup-system to restore if needed
        - Old backup releases are automatically cleaned up (keeping latest 10)
        
        EOF
        
        echo "📊 Backup report generated"