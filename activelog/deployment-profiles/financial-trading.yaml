# Financial Trading Workload Profile
# Optimized for high-frequency trading, low latency, and financial compliance

apiVersion: v1
kind: ConfigMap
metadata:
  name: financial-trading-profile
  namespace: activelog
data:
  profile_name: "FinancialTrading"
  workload_type: "financial_trading"
  
  # Resource allocation priorities
  resource_allocation: |
    trading-engine:
      cpu: "4000m"
      memory: "8Gi"
      priority: 1
      instances: 3
      node_affinity: "high-performance"
      
    settlement-engine:
      cpu: "2000m"
      memory: "4Gi"
      priority: 2
      instances: 2
      node_affinity: "high-performance"
      
    compliance-engine:
      cpu: "1000m"
      memory: "2Gi"
      priority: 2
      instances: 2
      node_affinity: "standard"
      
    market-data:
      cpu: "2000m"
      memory: "4Gi"
      priority: 1
      instances: 2
      node_affinity: "high-performance"
      
    wallet-service:
      cpu: "1000m"
      memory: "2Gi"
      priority: 3
      instances: 1
      node_affinity: "standard"
      
    dream-mode:
      cpu: "500m"
      memory: "1Gi"
      priority: 4
      instances: 1
      node_affinity: "standard"

  # Performance targets and SLAs
  performance_targets: |
    latency:
      trading_engine_response: "5ms"
      settlement_time: "100ms"
      market_data_feed: "1ms"
      order_execution: "10ms"
      
    throughput:
      orders_per_second: 10000
      trades_per_second: 5000
      market_updates_per_second: 100000
      
    availability:
      uptime_requirement: "99.99%"
      maximum_downtime_per_month: "4.32 minutes"
      
    compliance:
      audit_log_retention: "7 years"
      real_time_monitoring: true
      regulatory_reporting: true

  # Scaling rules
  scaling_rules: |
    auto_scaling:
      enabled: true
      cpu_threshold: 70
      memory_threshold: 80
      response_time_threshold: 10
      
    scaling_policies:
      scale_up_cooldown: 300
      scale_down_cooldown: 600
      min_instances: 2
      max_instances: 10
      
    triggers:
      - metric: "cpu_utilization"
        threshold: 70
        duration: 300
        action: "scale_up"
        
      - metric: "response_time"
        threshold: 20
        duration: 60
        action: "scale_up"
        
      - metric: "error_rate"
        threshold: 0.1
        duration: 60
        action: "alert"

  # Monitoring configuration
  monitoring: |
    metrics_collection:
      interval: 1
      retention: "30d"
      
    critical_metrics:
      - "trading.latency.p99"
      - "trading.throughput.tps"
      - "trading.errors.rate"
      - "settlement.queue.depth"
      - "market_data.lag.seconds"
      - "compliance.violations.count"
      
    alerting:
      critical_threshold: 1
      warning_threshold: 5
      notification_channels:
        - "trading-ops-slack"
        - "compliance-team-email"
        - "executive-dashboard"

  # Security configuration
  security: |
    encryption:
      at_rest: true
      in_transit: true
      key_rotation: "monthly"
      
    access_control:
      rbac_enabled: true
      mfa_required: true
      session_timeout: 30
      
    audit_logging:
      enabled: true
      level: "detailed"
      real_time_analysis: true
      
    compliance:
      sox_compliant: true
      pci_compliant: true
      gdpr_compliant: true

  # Network configuration
  networking: |
    service_mesh:
      enabled: true
      mtls: true
      traffic_policies:
        - "low_latency"
        - "high_availability"
        
    load_balancing:
      algorithm: "least_connections"
      health_checks:
        interval: 5
        timeout: 2
        retries: 3
        
    cdn:
      enabled: true
      cache_strategy: "aggressive"
      edge_locations: "global"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-engine-optimized
  namespace: activelog
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: trading-engine
      profile: financial-trading
  template:
    metadata:
      labels:
        app: trading-engine
        profile: financial-trading
    spec:
      nodeSelector:
        node-type: high-performance
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - trading-engine
            topologyKey: kubernetes.io/hostname
      containers:
      - name: trading-engine
        image: activelog/trading-engine:latest
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        env:
        - name: WORKLOAD_PROFILE
          value: "financial_trading"
        - name: MAX_CONNECTIONS
          value: "10000"
        - name: CACHE_SIZE
          value: "2Gi"
        - name: LOG_LEVEL
          value: "INFO"
        ports:
        - containerPort: 8400
        livenessProbe:
          httpGet:
            path: /health
            port: 8400
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 8400
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: trading-engine-service
  namespace: activelog
spec:
  selector:
    app: trading-engine
    profile: financial-trading
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8400
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trading-engine-hpa
  namespace: activelog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trading-engine-optimized
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: trading_latency_p99
      target:
        type: AverageValue
        averageValue: "10m"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 50
        periodSeconds: 300