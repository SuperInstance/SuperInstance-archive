# Prometheus configuration for ActiveLog monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'activelog-production'
    environment: 'production'

# Rule files
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics

  # API Gateway metrics
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s
    honor_labels: true

  # Auth Service metrics
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth:8001']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Metadata Service metrics
  - job_name: 'metadata-service'
    static_configs:
      - targets: ['metadata:8002']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # File Processor Service metrics
  - job_name: 'file-processor-service'
    static_configs:
      - targets: ['file-processor:8003']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # AI Orchestrator Service metrics
  - job_name: 'ai-orchestrator-service'
    static_configs:
      - targets: ['ai-orchestrator:8004']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # Notification Service metrics
  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification:8005']
    scrape_interval: 15s
    metrics_path: /metrics
    scrape_timeout: 10s

  # PostgreSQL metrics (using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: /metrics

  # Redis metrics (using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metrics_path: /metrics

  # Nginx metrics (using nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s
    metrics_path: /metrics

  # Fluentd metrics
  - job_name: 'fluentd'
    static_configs:
      - targets: ['fluentd:24231']
    scrape_interval: 30s
    metrics_path: /metrics

  # Docker metrics (using cadvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # Blackbox exporter for endpoint monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://api-gateway:8000/health
        - http://auth:8001/health
        - http://metadata:8002/health
        - http://file-processor:8003/health
        - http://ai-orchestrator:8004/health
        - http://notification:8005/health
        - http://frontend:3000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      path_prefix: /
      scheme: http
      timeout: 30s
      api_version: v1

# Storage configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 10GB
    wal-compression: true