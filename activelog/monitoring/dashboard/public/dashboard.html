<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveLog System Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #64b5f6, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        
        .status-healthy { background-color: #4caf50; }
        .status-degraded { background-color: #ff9800; }
        .status-critical { background-color: #f44336; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h3 {
            margin-bottom: 15px;
            color: #64b5f6;
            font-size: 1.2em;
        }
        
        .service-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .service-status:last-child {
            border-bottom: none;
        }
        
        .service-name {
            font-weight: bold;
        }
        
        .service-port {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #64b5f6;
        }
        
        .metric-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .logs-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85em;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .log-timestamp {
            color: #90a4ae;
            margin-right: 10px;
        }
        
        .log-service {
            color: #64b5f6;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .log-message {
            color: #fff;
        }
        
        .chart-container {
            height: 200px;
            margin-top: 15px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9em;
            z-index: 1000;
        }
        
        .connected {
            background-color: #4caf50;
        }
        
        .disconnected {
            background-color: #f44336;
        }
        
        .last-updated {
            text-align: center;
            margin-top: 20px;
            opacity: 0.7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ActiveLog System Dashboard</h1>
            <p id="system-status">Initializing system monitoring...</p>
        </div>
        
        <div class="connection-status disconnected" id="connection-status">
            Connecting...
        </div>
        
        <div class="grid">
            <!-- System Overview Card -->
            <div class="card">
                <h3>System Overview</h3>
                <div id="overview-content">
                    <div class="metric-value" id="total-services">-</div>
                    <div class="metric-label">Total Services</div>
                    <div style="margin-top: 15px;">
                        <div class="metric-value" id="healthy-services">-</div>
                        <div class="metric-label">Healthy Services</div>
                    </div>
                    <div style="margin-top: 15px;">
                        <div class="metric-value" id="system-uptime">-</div>
                        <div class="metric-label">System Uptime</div>
                    </div>
                </div>
            </div>
            
            <!-- Services Status Card -->
            <div class="card">
                <h3>Service Status</h3>
                <div id="services-list">
                    <!-- Services will be populated here -->
                </div>
            </div>
            
            <!-- Performance Metrics Card -->
            <div class="card">
                <h3>Performance Metrics</h3>
                <div class="chart-container">
                    <canvas id="performance-chart"></canvas>
                </div>
            </div>
            
            <!-- Active Alerts Card -->
            <div class="card">
                <h3>Active Alerts</h3>
                <div id="alerts-content">
                    <div style="text-align: center; opacity: 0.7;">
                        No active alerts
                    </div>
                </div>
            </div>
            
            <!-- System Logs Card -->
            <div class="card full-width">
                <h3>System Logs</h3>
                <div class="logs-container" id="logs-container">
                    <!-- Logs will be populated here -->
                </div>
            </div>
        </div>
        
        <div class="last-updated" id="last-updated">
            Last updated: Never
        </div>
    </div>

    <script>
        // Initialize Socket.IO connection
        const socket = io();
        
        // Connection status
        const connectionStatus = document.getElementById('connection-status');
        
        socket.on('connect', () => {
            connectionStatus.textContent = 'Connected';
            connectionStatus.className = 'connection-status connected';
            console.log('Connected to monitoring server');
        });
        
        socket.on('disconnect', () => {
            connectionStatus.textContent = 'Disconnected';
            connectionStatus.className = 'connection-status disconnected';
            console.log('Disconnected from monitoring server');
        });
        
        // Performance chart setup
        const ctx = document.getElementById('performance-chart').getContext('2d');
        const performanceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Response Time (ms)',
                    data: [],
                    borderColor: '#64b5f6',
                    backgroundColor: 'rgba(100, 181, 246, 0.1)',
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#fff'
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#fff' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' }
                    },
                    y: {
                        ticks: { color: '#fff' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' }
                    }
                }
            }
        });
        
        // System logs
        const logsContainer = document.getElementById('logs-container');
        const maxLogs = 50;
        let logs = [];
        
        function addLog(service, message, level = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = {
                timestamp,
                service,
                message,
                level
            };
            
            logs.unshift(logEntry);
            if (logs.length > maxLogs) {
                logs.pop();
            }
            
            updateLogsDisplay();
        }
        
        function updateLogsDisplay() {
            logsContainer.innerHTML = logs.map(log => `
                <div class="log-entry">
                    <span class="log-timestamp">${log.timestamp}</span>
                    <span class="log-service">[${log.service}]</span>
                    <span class="log-message">${log.message}</span>
                </div>
            `).join('');
            
            logsContainer.scrollTop = 0;
        }
        
        // Handle system status updates
        socket.on('system-status', (data) => {
            updateSystemOverview(data);
            updateServicesStatus(data);
            updatePerformanceChart(data);
            updateLastUpdated();
            
            addLog('SYSTEM', 'System status updated');
        });
        
        function updateSystemOverview(data) {
            if (!data.health) return;
            
            const { health } = data;
            
            // Update system status indicator
            const systemStatusElement = document.getElementById('system-status');
            const statusClass = health.status === 'healthy' ? 'status-healthy' : 
                               health.status === 'degraded' ? 'status-degraded' : 'status-critical';
            
            systemStatusElement.innerHTML = `
                System Status: ${health.status.charAt(0).toUpperCase() + health.status.slice(1)}
                <span class="status-indicator ${statusClass}"></span>
            `;
            
            // Update overview metrics
            document.getElementById('total-services').textContent = health.summary?.total || '-';
            document.getElementById('healthy-services').textContent = health.summary?.healthy || '-';
            document.getElementById('system-uptime').textContent = 
                health.uptime ? formatUptime(health.uptime) : '-';
        }
        
        function updateServicesStatus(data) {
            if (!data.health?.services) return;
            
            const servicesList = document.getElementById('services-list');
            const services = data.health.services;
            
            servicesList.innerHTML = services.map(service => {
                const statusClass = service.status === 'healthy' ? 'status-healthy' : 
                                   service.status === 'degraded' ? 'status-degraded' : 'status-critical';
                
                return `
                    <div class="service-status">
                        <div>
                            <div class="service-name">${service.name}</div>
                            <div class="service-port">Port ${service.port}</div>
                        </div>
                        <div>
                            <span class="status-indicator ${statusClass}"></span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function updatePerformanceChart(data) {
            const now = new Date().toLocaleTimeString();
            const avgResponseTime = calculateAverageResponseTime(data);
            
            performanceChart.data.labels.push(now);
            performanceChart.data.datasets[0].data.push(avgResponseTime);
            
            // Keep only last 20 data points
            if (performanceChart.data.labels.length > 20) {
                performanceChart.data.labels.shift();
                performanceChart.data.datasets[0].data.shift();
            }
            
            performanceChart.update('none');
        }
        
        function calculateAverageResponseTime(data) {
            if (!data.metrics || data.metrics.length === 0) return 0;
            
            const responseTimes = data.metrics
                .filter(m => m.responseTime && m.responseTime !== 'N/A')
                .map(m => parseFloat(m.responseTime));
            
            return responseTimes.length > 0 
                ? responseTimes.reduce((a, b) => a + b, 0) / responseTimes.length 
                : 0;
        }
        
        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }
        
        function updateLastUpdated() {
            document.getElementById('last-updated').textContent = 
                `Last updated: ${new Date().toLocaleString()}`;
        }
        
        // Initialize with some sample logs
        addLog('DASHBOARD', 'Monitoring dashboard initialized');
        addLog('WEBSOCKET', 'Real-time connection established');
        
        // Subscribe to updates
        socket.emit('subscribe', { type: 'system-status' });
        
        console.log('ActiveLog Monitoring Dashboard initialized');
    </script>
</body>
</html>
