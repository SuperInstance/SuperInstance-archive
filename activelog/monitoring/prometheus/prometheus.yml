  # Database metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Frontend application
  - job_name: 'frontend'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Jaeger metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger-all-in-one:14269']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 30s

  # Blackbox probes for service health
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://host.docker.internal:8000/health  # API Gateway
        - http://host.docker.internal:8001/health  # Auth Service
        - http://host.docker.internal:8002/health  # Metadata Service
        - http://host.docker.internal:8003/health  # File Processor
        - http://host.docker.internal:8004/health  # AI Orchestrator
        - http://host.docker.internal:8005/health  # Notification Service
        - http://host.docker.internal:8006/health  # Backup Service
        - http://host.docker.internal:8007/health  # Collaboration Service
        - http://host.docker.internal:8008/health  # Data Export Service
        - http://host.docker.internal:8009/health  # Document AI Service
        - http://host.docker.internal:8010/health  # GraphQL Service
        - http://host.docker.internal:8011/health  # Mobile API Service
        - http://host.docker.internal:8012/health  # ML Pipeline Service
        - http://host.docker.internal:8013/health  # Smart Folders Service
        - http://host.docker.internal:8014/health  # Sync Engine Service
        - http://host.docker.internal:8015/health  # Video Pipeline Service
        - http://host.docker.internal:8016/health  # Video Processor Service
        - http://host.docker.internal:8017/health  # Workflows Service
        - http://host.docker.internal:8018/health  # Analytics Service
        - http://host.docker.internal:8019/health  # Batch Import Service
        - http://host.docker.internal:8020/health  # Cache Service
        - http://host.docker.internal:8021/health  # P2P Sync Service
        - http://host.docker.internal:8022/health  # File Watcher Service
        - http://host.docker.internal:3000/health  # Frontend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # GraphQL endpoint monitoring
  - job_name: 'blackbox-graphql'
    metrics_path: /probe
    params:
      module: [graphql_check]
    static_configs:
      - targets:
        - http://host.docker.internal:8010/graphql
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

