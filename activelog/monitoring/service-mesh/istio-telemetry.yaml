apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-telemetry-config
  namespace: istio-system
data:
  custom_bootstrap.json: |
    {
      "stats_sinks": [
        {
          "name": "envoy.stat_sinks.statsd",
          "typed_config": {
            "@type": "type.googleapis.com/envoy.extensions.stat_sinks.statsd.v3.StatsdSink",
            "address": {
              "socket_address": {
                "address": "prometheus-statsd-exporter",
                "port_value": 9125
              }
            }
          }
        }
      ],
      "stats_config": {
        "stats_tags": [
          {
            "tag_name": "service_name",
            "regex": "^cluster\\.((.+?)\\.).*",
            "fixed_value": "\\1"
          },
          {
            "tag_name": "request_method", 
            "regex": "^http\\.(.+?)\\.downstream_rq_(.+?)\\.",
            "fixed_value": "\\2"
          }
        ]
      }
    }
---
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: activelog-istio-config
spec:
  values:
    telemetry:
      v2:
        enabled: true
        prometheus:
          configOverride:
            metric_relabeling_configs:
              - source_labels: [__name__]
                regex: 'istio_.*'
                target_label: __tmp_istio_metric
              - source_labels: [__tmp_istio_metric]
                regex: '.*'
                target_label: source
                replacement: 'istio'
    pilot:
      traceSampling: 1.0
      env:
        PILOT_ENABLE_WORKLOAD_ENTRY_AUTOREGISTRATION: true
        PILOT_ENABLE_CROSS_CLUSTER_WORKLOAD_ENTRY: true
  meshConfig:
    defaultConfig:
      tracing:
        jaeger:
          address: jaeger-collector.monitoring.svc.cluster.local:14268
        sampling: 100.0
      proxyStatsMatcher:
        inclusionRegexps:
          - ".*outlier_detection.*"
          - ".*circuit_breaker.*"
          - ".*upstream_rq_retry.*"
          - ".*upstream_rq_pending.*" 
          - ".*_cx_.*"
        exclusionRegexps:
          - ".*osconfig.*"
    extensionProviders:
      - name: jaeger-tracing
        jaeger:
          service: jaeger-collector.monitoring.svc.cluster.local
          port: 14268
      - name: prometheus-metrics
        prometheus:
          configOverride:
            metric_relabeling_configs:
              - source_labels: [__name__]
                regex: 'istio_request_duration_milliseconds.*'
                target_label: __tmp_istio_request_duration
              - source_labels: [__tmp_istio_request_duration]
                regex: '.*'
                target_label: metric_type
                replacement: 'latency'
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: activelog-metrics
  namespace: istio-system
spec:
  metrics:
  - providers:
    - name: prometheus-metrics
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        destination_service_name:
          value: "%{RESPONSE_HEADERS['service-name'] | 'unknown'}"
        source_workload:
          value: "%{SOURCE_WORKLOAD | 'unknown'}"
        destination_workload: 
          value: "%{DESTINATION_WORKLOAD | 'unknown'}"
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: activelog-tracing
  namespace: istio-system
spec:
  tracing:
  - providers:
    - name: jaeger-tracing
  - randomSamplingPercentage: 1.0
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: activelog-access-logs
  namespace: istio-system
spec:
  accessLogging:
  - providers:
    - name: activelog-logs
  - format: |
      {
        "timestamp": "%START_TIME%",
        "method": "%REQ(:METHOD)%",
        "path": "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%",
        "protocol": "%PROTOCOL%",
        "response_code": "%RESPONSE_CODE%",
        "response_flags": "%RESPONSE_FLAGS%",
        "bytes_received": "%BYTES_RECEIVED%",
        "bytes_sent": "%BYTES_SENT%",
        "duration": "%DURATION%",
        "upstream_service_time": "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%",
        "x_forwarded_for": "%REQ(X-FORWARDED-FOR)%",
        "user_agent": "%REQ(USER-AGENT)%",
        "request_id": "%REQ(X-REQUEST-ID)%",
        "authority": "%REQ(:AUTHORITY)%",
        "upstream_host": "%UPSTREAM_HOST%",
        "upstream_cluster": "%UPSTREAM_CLUSTER%",
        "upstream_local_address": "%UPSTREAM_LOCAL_ADDRESS%",
        "downstream_local_address": "%DOWNSTREAM_LOCAL_ADDRESS%",
        "downstream_remote_address": "%DOWNSTREAM_REMOTE_ADDRESS%",
        "requested_server_name": "%REQUESTED_SERVER_NAME%",
        "route_name": "%ROUTE_NAME%"
      }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: activelog-envoy-config
  namespace: istio-system
data:
  envoy_config.yaml: |
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          protocol: TCP
          address: 127.0.0.1
          port_value: 9901
    
    stats_sinks:
      - name: envoy.stat_sinks.statsd
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.stat_sinks.statsd.v3.StatsdSink
          address:
            socket_address:
              address: prometheus-statsd-exporter
              port_value: 9125
          prefix: activelog.envoy
    
    tracing:
      http:
        name: envoy.tracers.jaeger
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.tracers.jaeger.v3.JaegerConfig
          collector_cluster: jaeger_collector
          collector_endpoint: /api/traces
          collector_hostname: jaeger-collector
    
    static_resources:
      clusters:
        - name: jaeger_collector
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: jaeger_collector
            endpoints:
              - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: jaeger-collector
                        port_value: 14268