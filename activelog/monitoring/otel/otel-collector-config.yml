receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831

  zipkin:
    endpoint: 0.0.0.0:9411

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s

  resource:
    attributes:
      - key: environment
        value: "production"
        action: upsert
      - key: service.namespace
        value: "activelog"
        action: upsert

  resourcedetection:
    detectors: [env, system, docker]
    timeout: 5s
    override: false

  attributes:
    actions:
      - key: drop_me
        action: delete
      - key: redact_trace
        action: update
        value: "***"

  span:
    name:
      to_attributes:
        rules:
          - "^\/api\/v1\/(?P<version>.*?)\/(?P<operation>.*?)$"
      from_attributes: ["http.method", "http.route"]

  filter:
    traces:
      span:
        - 'attributes["http.url"] != nil and IsMatch(attributes["http.url"], ".*healthcheck.*") == true'
        - 'attributes["http.url"] != nil and IsMatch(attributes["http.url"], ".*metrics.*") == true'

  probabilistic_sampler:
    hash_seed: 22
    sampling_percentage: 15.3

  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    policies:
      [
        {
          name: errors-policy,
          type: status_code,
          status_code: {status_codes: [ERROR]}
        },
        {
          name: slow-traces-policy,
          type: latency,
          latency: {threshold_ms: 5000}
        },
        {
          name: health-traces,
          type: string_attribute,
          string_attribute: {key: http.url, values: [/health, /metrics], enabled_regex_matching: true, invert_match: true}
        },
        {
          name: probabilistic-policy,
          type: probabilistic,
          probabilistic: {sampling_percentage: 10}
        }
      ]

exporters:
  # Traces
  jaeger:
    endpoint: jaeger-all-in-one:14250
    tls:
      insecure: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      environment: production

  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
    tls:
      insecure: true
    
  # Logs
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

  # Debug
  logging:
    loglevel: debug

  # File export for backup
  file:
    path: /tmp/otel-data

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [memory_limiter, resourcedetection, resource, batch, tail_sampling]
      exporters: [jaeger, otlp/tempo, logging]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [prometheus, prometheusremotewrite]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [loki, logging]

  telemetry:
    logs:
      level: "debug"
    metrics:
      address: 0.0.0.0:8888