[api]
enabled = true
address = "0.0.0.0:8686"

[sources.docker_logs]
type = "docker_logs"
include_containers = []
exclude_containers = []

[sources.file_logs]
type = "file"
include = ["/var/log/**/*.log"]
exclude = ["/var/log/wtmp", "/var/log/btmp"]

[sources.activelog_logs]
type = "file"
include = ["/home/activeloguser/activelog/logs/*.log"]

[sources.syslog]
type = "syslog"
mode = "udp"
address = "0.0.0.0:514"

[transforms.parse_activelog]
type = "remap"
inputs = ["activelog_logs"]
source = '''
  . = parse_json!(.message)
  .timestamp = parse_timestamp!(.timestamp, format: "%Y-%m-%dT%H:%M:%S%.fZ")
'''

[transforms.enrich_logs]
type = "remap"
inputs = ["docker_logs", "file_logs", "parse_activelog"]
source = '''
  .host = get_hostname!()
  .pipeline = "vector"
  
  # Add service name from container labels or file path
  if exists(.container_name) {
    .service = .container_name
  } else if exists(.file) {
    .service = replace(.file, r'^.*/([^/]+)\.log$', "$1")
  }
  
  # Parse log level
  if match(.message, r'(ERROR|WARN|INFO|DEBUG)') {
    .level = downcase(extract!(.message, r'(ERROR|WARN|INFO|DEBUG)'))
  } else {
    .level = "info"
  }
  
  # Extract trace information if present
  if match(.message, r'trace_id=([a-f0-9]+)') {
    .trace_id = extract!(.message, r'trace_id=([a-f0-9]+)')
  }
  
  if match(.message, r'span_id=([a-f0-9]+)') {
    .span_id = extract!(.message, r'span_id=([a-f0-9]+)')
  }
'''

[sinks.loki_sink]
type = "loki"
inputs = ["enrich_logs"]
endpoint = "http://loki:3100"
labels.job = "activelog-vector"
labels.host = "{{ host }}"
labels.service = "{{ service }}"
labels.level = "{{ level }}"

[sinks.elasticsearch_sink]
type = "elasticsearch"
inputs = ["enrich_logs"]
endpoint = "http://elasticsearch:9200"
index = "activelog-logs-%Y.%m.%d"

[sinks.prometheus_metrics]
type = "prometheus_exporter"
inputs = ["enrich_logs"]
address = "0.0.0.0:9598"
default_namespace = "vector"

[sinks.console_sink]
type = "console"
inputs = ["enrich_logs"]
encoding.codec = "json"