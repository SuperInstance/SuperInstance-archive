# AlertManager Configuration
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@activelog.com'
  smtp_auth_username: 'alerts@activelog.com'
  smtp_auth_password: 'your-smtp-password'
  
  # Slack webhook URL
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Inhibit rules - suppress certain alerts when others are firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'web.hook'
  routes:
  
  # Critical alerts go to multiple channels
  - match:
      severity: critical
    receiver: 'critical-alerts'
    group_wait: 5s
    repeat_interval: 5m
    routes:
    - match:
        service: 'graphql'
      receiver: 'graphql-critical'
    - match:
        service: 'mobile-api'
      receiver: 'mobile-api-critical'
    - match:
        service: 'redis'
      receiver: 'infrastructure-critical'

  # Warning alerts
  - match:
      severity: warning
    receiver: 'warning-alerts'
    group_wait: 30s
    repeat_interval: 1h

  # Performance regression alerts
  - match:
      type: regression
    receiver: 'performance-team'
    group_wait: 15s
    repeat_interval: 2h

  # Security alerts
  - match:
      type: security
    receiver: 'security-team'
    group_wait: 5s
    repeat_interval: 30m

  # Business logic alerts
  - match:
      service: business
    receiver: 'business-team'
    group_wait: 30s
    repeat_interval: 1h

# Receivers configuration
receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://127.0.0.1:5001/'

# Critical alerts - multiple notification channels
- name: 'critical-alerts'
  email_configs:
  - to: 'oncall@activelog.com'
    subject: '[CRITICAL] ActiveLog Alert - {{ .GroupLabels.alertname }}'
    body: |
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Instance: {{ .Labels.instance }}
      Severity: {{ .Labels.severity }}
      {{ end }}
  slack_configs:
  - channel: '#alerts-critical'
    color: 'danger'
    title: 'Critical Alert: {{ .GroupLabels.alertname }}'
    text: |
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Instance:* {{ .Labels.instance }}
      *Severity:* {{ .Labels.severity }}
      {{ end }}
  webhook_configs:
  - url: 'http://pagerduty-webhook:8080/webhook'
    send_resolved: true

# GraphQL service critical alerts
- name: 'graphql-critical'
  email_configs:
  - to: 'graphql-team@activelog.com'
    subject: '[CRITICAL] GraphQL Service Alert'
    body: |
      {{ range .Alerts }}
      GraphQL Service Alert
      =====================
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Service: {{ .Labels.service }}
      Instance: {{ .Labels.instance }}
      Time: {{ .StartsAt }}
      {{ end }}
  slack_configs:
  - channel: '#graphql-alerts'
    color: 'danger'
    title: 'GraphQL Critical Alert'
    text: |
      {{ range .Alerts }}
      🚨 *GraphQL Service Critical Alert*
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Instance:* {{ .Labels.instance }}
      {{ end }}

