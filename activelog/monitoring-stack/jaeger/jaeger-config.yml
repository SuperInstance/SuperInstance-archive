# Jaeger Configuration for ActiveLog Distributed Tracing
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-configuration
  namespace: monitoring
data:
  jaeger.yaml: |
    # Jaeger Collector Configuration
    collector:
      # gRPC server configuration
      grpc-server:
        host-port: 0.0.0.0:14250
      
      # HTTP server configuration  
      http-server:
        host-port: 0.0.0.0:14268
      
      # Zipkin HTTP server
      zipkin:
        host-port: 0.0.0.0:9411
      
      # Log level
      log-level: info
      
      # Span storage type
      span-storage:
        type: elasticsearch
      
      # Queue configuration
      queue:
        size: 10000
        workers: 50
      
      # Sampling strategies
      sampling:
        strategies-file: /etc/jaeger/sampling_strategies.json
    
    # Query Service Configuration
    query:
      # HTTP server configuration
      http-server:
        host-port: 0.0.0.0:16686
      
      # gRPC server configuration
      grpc-server:
        host-port: 0.0.0.0:16685
      
      # Log level
      log-level: info
      
      # Base path for UI
      base-path: /
      
      # Additional query options
      additional-headers:
        - "Access-Control-Allow-Origin: *"
        - "Access-Control-Allow-Methods: GET, POST, OPTIONS"
        - "Access-Control-Allow-Headers: Content-Type, Authorization"
    
    # Agent Configuration
    agent:
      # Jaeger agent server configuration
      jaeger:
        thrift-compact:
          server-host-port: 0.0.0.0:6831
        thrift-binary:
          server-host-port: 0.0.0.0:6832
        thrift-http:
          server-host-port: 0.0.0.0:14268
      
      # Zipkin agent configuration
      zipkin:
        thrift:
          server-host-port: 0.0.0.0:5775
      
      # Log level
      log-level: info
      
      # Sampling strategies
      sampling:
        strategies-file: /etc/jaeger/sampling_strategies.json
    
    # Storage Configuration
    storage:
      # Elasticsearch configuration
      elasticsearch:
        server-urls: http://elasticsearch:9200
        username: ""
        password: ""
        sniffer: false
        max-span-age: 168h
        num-shards: 5
        num-replicas: 1
        bulk:
          size: 5000000
          workers: 1
          actions: 1000
          flush-interval: 200ms
        indices:
          spans:
            date-layout: "2006-01-02"
            rollover-frequency: "day"
            max-age: 168h
          services:
            date-layout: "2006-01-02" 
            rollover-frequency: "day"
            max-age: 168h
          dependencies:
            date-layout: "2006-01-02"
            rollover-frequency: "day"
            max-age: 168h
        tags-as-fields:
          all: false
          include: "http.method,http.status_code,error,span.kind,component,db.type,db.instance"
        create-index-templates: true
  
  sampling_strategies.json: |
    {
      "service_strategies": [
        {
          "service": "activelog-api",
          "type": "probabilistic",
          "param": 0.5,
          "max_traces_per_second": 100
        },
        {
          "service": "activelog-web",
          "type": "probabilistic", 
          "param": 0.3,
          "max_traces_per_second": 50
        },
        {
          "service": "activelog-auth",
          "type": "probabilistic",
          "param": 1.0,
          "max_traces_per_second": 200
        },
        {
          "service": "ml-platform",
          "type": "probabilistic",
          "param": 0.1,
          "max_traces_per_second": 20
        },
        {
          "service": "integration-controller",
          "type": "probabilistic",
          "param": 0.8,
          "max_traces_per_second": 80
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1,
        "max_traces_per_second": 50
      },
      "per_operation_strategies": [
        {
          "service": "activelog-api",
          "operation": "POST /api/auth/login",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "activelog-api", 
          "operation": "POST /api/users/register",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "activelog-api",
          "operation": "POST /api/payments/*",
          "type": "probabilistic",
          "param": 1.0
        }
      ]
    }

---
# Jaeger All-in-One Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-all-in-one
  namespace: monitoring
  labels:
    app: jaeger
    component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
      component: all-in-one
  template:
    metadata:
      labels:
        app: jaeger
        component: all-in-one
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.35
        ports:
        - containerPort: 16686
          name: query
        - containerPort: 16685
          name: query-grpc
        - containerPort: 14268
          name: collector
        - containerPort: 14250
          name: collector-grpc
        - containerPort: 6831
          name: agent-compact
          protocol: UDP
        - containerPort: 6832
          name: agent-binary
          protocol: UDP
        - containerPort: 5775
          name: zipkin-compact
          protocol: UDP
        - containerPort: 9411
          name: zipkin
        env:
        - name: SPAN_STORAGE_TYPE
          value: elasticsearch
        - name: ES_SERVER_URLS
          value: http://elasticsearch:9200
        - name: ES_USERNAME
          value: ""
        - name: ES_PASSWORD
          value: ""
        - name: ES_TAGS_AS_FIELDS_ALL
          value: "false"
        - name: ES_TAGS_AS_FIELDS_INCLUDE
          value: "http.method,http.status_code,error,span.kind,component,db.type,db.instance"
        - name: ES_NUM_SHARDS
          value: "5"
        - name: ES_NUM_REPLICAS
          value: "1"
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: QUERY_BASE_PATH
          value: /jaeger
        volumeMounts:
        - name: jaeger-config
          mountPath: /etc/jaeger
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi" 
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: jaeger-config
        configMap:
          name: jaeger-configuration

---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  type: ClusterIP
  ports:
  - port: 16686
    targetPort: 16686
    name: query
  - port: 16685
    targetPort: 16685
    name: query-grpc
  - port: 14268
    targetPort: 14268
    name: collector
  - port: 14250
    targetPort: 14250
    name: collector-grpc
  - port: 6831
    targetPort: 6831
    name: agent-compact
    protocol: UDP
  - port: 6832
    targetPort: 6832
    name: agent-binary
    protocol: UDP
  - port: 5775
    targetPort: 5775
    name: zipkin-compact
    protocol: UDP
  - port: 9411
    targetPort: 9411
    name: zipkin
  selector:
    app: jaeger
    component: all-in-one

---
# Jaeger Agent DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jaeger-agent
  namespace: monitoring
  labels:
    app: jaeger
    component: agent
spec:
  selector:
    matchLabels:
      app: jaeger
      component: agent
  template:
    metadata:
      labels:
        app: jaeger
        component: agent
    spec:
      containers:
      - name: jaeger-agent
        image: jaegertracing/jaeger-agent:1.35
        ports:
        - containerPort: 5775
          name: zk-compact-trft
          protocol: UDP
        - containerPort: 5778
          name: config-rest
        - containerPort: 6831
          name: jg-compact-trft
          protocol: UDP
        - containerPort: 6832
          name: jg-binary-trft
          protocol: UDP
        - containerPort: 14271
          name: admin-http
        env:
        - name: REPORTER_GRPC_HOST_PORT
          value: jaeger:14250
        - name: REPORTER_TYPE
          value: grpc
        - name: LOG_LEVEL
          value: info
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 14271
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 14271
          initialDelaySeconds: 5
          periodSeconds: 10
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet