# Kibana configuration for ActiveLog log visualization
# Production-ready configuration with security and monitoring

# =================== System: Kibana Server ===================

# Kibana is served by a back end server. This setting specifies the port to use.
server.port: 5601

# Specifies the address to which the Kibana server will bind. IP addresses and host names are both valid values.
# The default is 'localhost', which usually means remote machines will not be able to connect.
# To allow connections from remote users, set this parameter to a non-loopback address.
server.host: "0.0.0.0"

# Enables you to specify a path to mount Kibana at if you are running behind a proxy.
# Use the `server.rewriteBasePath` setting to tell Kibana if it should remove the basePath
# from requests it receives, and to prevent a deprecation warning at startup.
# This setting cannot end in a slash.
server.basePath: "/kibana"

# Specifies whether Kibana should rewrite requests that are prefixed with
# `server.basePath` or require that they are rewritten by your reverse proxy.
# This setting was effectively always `false` before Kibana 6.3 and will
# default to `true` starting in Kibana 7.0.
server.rewriteBasePath: true

# Specifies the public URL at which Kibana is available for end users. If
# `server.basePath` is configured this URL should end with the same basePath.
server.publicBaseUrl: "https://logs.activelog.com/kibana"

# The maximum payload size in bytes for incoming server requests.
server.maxPayloadBytes: 1048576

# The Kibana server's name.  This is used for display purposes.
server.name: kibana-activelog

# =================== System: Kibana Server (Optional) ===================

# Enables SSL and paths to the PEM-format SSL certificate and SSL key files, respectively.
# These settings enable SSL for outgoing requests from the Kibana server to the browser.
server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana.key

# Optional settings that provide the paths to the PEM-format SSL certificate and key files.
# These files are used to verify the identity of Kibana to Elasticsearch and are required when
# xpack.security.http.ssl.client_authentication in Elasticsearch is set to required.
server.ssl.certificateAuthorities: [ "/usr/share/kibana/config/certs/ca.crt" ]

# To disregard the validity of SSL certificates, change this setting's value to 'none'.
server.ssl.verificationMode: full

# =================== System: Elasticsearch ===================

# The URLs of the Elasticsearch instances to use for all your queries.
elasticsearch.hosts: ["https://elasticsearch:9200"]

# Kibana uses an index in Elasticsearch to store saved searches, visualizations and
# dashboards. Kibana creates a new index if the index doesn't already exist.
kibana.index: ".kibana-activelog"

# The default application to load.
kibana.defaultAppId: "discover"

# If your Elasticsearch is protected with basic authentication, these settings provide
# the username and password that the Kibana server uses to perform maintenance on the Kibana
# index at startup. Your Kibana users still need to authenticate with Elasticsearch, which
# is proxied through the Kibana server.
elasticsearch.username: "kibana_system"
elasticsearch.password: "${KIBANA_SYSTEM_PASSWORD}"

# Enables SSL and paths to the PEM-format SSL certificate and SSL key files, respectively.
# These files are used to verify the identity of Kibana to Elasticsearch and are required when
# xpack.security.http.ssl.client_authentication in Elasticsearch is set to required.
elasticsearch.ssl.certificateAuthorities: [ "/usr/share/kibana/config/certs/ca.crt" ]

# To disregard the validity of SSL certificates, change this setting's value to 'none'.
elasticsearch.ssl.verificationMode: full

# Time in milliseconds to wait for Elasticsearch to respond to pings. Defaults to the value of
# the elasticsearch.requestTimeout setting.
elasticsearch.pingTimeout: 1500

# Time in milliseconds to wait for responses from the back end or Elasticsearch. This value
# must be a positive integer.
elasticsearch.requestTimeout: 30000

# List of Kibana client-side headers to send to Elasticsearch. To send *no* client-side
# headers, set this value to [] (an empty list).
elasticsearch.requestHeadersWhitelist: [ "authorization" ]

# Header names and values that are sent to Elasticsearch. Any custom headers cannot be overwritten
# by client-side headers, regardless of the elasticsearch.requestHeadersWhitelist configuration.
#elasticsearch.customHeaders: {}

# Time in milliseconds for Elasticsearch to wait for responses from shards. Set to 0 to disable.
elasticsearch.shardTimeout: 30000

# =================== System: Logging ===================

# Set the value of this setting to off to suppress all logging output, or to debug to log everything.
logging.level: info

# Enables you specify a file where Kibana stores log output.
logging.dest: /usr/share/kibana/logs/kibana.log

# Logs queries sent to Elasticsearch. Requires logging.level set to debug.
logging.json: true

# Logs http responses and requests to Elasticsearch. Requires logging.level set to debug.
logging.verbose: false

# =================== System: Other ===================

# The path where Kibana stores persistent data not saved in Elasticsearch. Defaults to data
#path.data: data

# Specifies the path where Kibana creates the process ID file.
pid.file: /run/kibana/kibana.pid

# Enables you to specify a file where Kibana stores log output.
#logging.dest: stdout

# Set the value of this setting to true to suppress all logging output other than error messages.
#logging.silent: false

# Set the value of this setting to true to suppress all logging output.
#logging.quiet: false

# Set the value of this setting to true to log all events, including system usage information
# and all requests.
#logging.verbose: false

# =================== Security ===================

# X-Pack Security settings
xpack.security.enabled: true
xpack.security.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.security.sessionTimeout: 3600000

# Authentication settings
xpack.security.auth.providers: ["basic"]

# =================== Monitoring ===================

# X-Pack Monitoring settings
xpack.monitoring.enabled: true
xpack.monitoring.collection.enabled: true
xpack.monitoring.ui.container.elasticsearch.enabled: true
xpack.monitoring.ui.container.logstash.enabled: true

# =================== Machine Learning ===================

# X-Pack Machine Learning settings (if available)
xpack.ml.enabled: true

# =================== Reporting ===================

# X-Pack Reporting settings
xpack.reporting.enabled: true
xpack.reporting.encryptionKey: "${KIBANA_REPORTING_KEY}"
xpack.reporting.kibanaServer.hostname: "localhost"
xpack.reporting.kibanaServer.port: 5601
xpack.reporting.kibanaServer.protocol: "https"

# =================== Alerting ===================

# X-Pack Alerting settings
xpack.alerting.enabled: true
xpack.actions.enabled: true

# =================== Canvas ===================

# X-Pack Canvas settings
xpack.canvas.enabled: true

# =================== Dashboard Mode ===================

# Set to true to enable dashboard-only mode for specific users
xpack.reporting.roles.enabled: false

# =================== Saved Objects ===================

# The maximum number of saved objects that can be imported at once
savedObjects.maxImportExportSize: 10000

# =================== Spaces ===================

# X-Pack Spaces settings
xpack.spaces.enabled: true
xpack.spaces.maxSpaces: 1000

# =================== Index Patterns ===================

# Default index patterns
kibana.defaultIndexPattern: "activelog-logs-*"

# =================== Telemetry ===================

# Set to false to disable telemetry
telemetry.enabled: false
telemetry.optIn: false

# =================== Newsfeed ===================

# Set to false to disable newsfeed
newsfeed.enabled: false

# =================== Advanced Settings ===================

# Advanced settings that can be modified via the Kibana UI
# These are defaults and can be overridden

# Maximum number of buckets for aggregations
# aggregations:maxBuckets: 10000

# CSV export settings
# csv:separator: ","
# csv:quoteValues: true

# Default columns in Discover
# defaultColumns: ["_source"]

# Default index pattern
# defaultIndex: "activelog-logs-*"

# Date format
# dateFormat: "MMM D, YYYY @ HH:mm:ss.SSS"

# Date format with nanoseconds
# dateNanosFormat: "MMM D, YYYY @ HH:mm:ss.SSSSSSSSS"

# Timezone for date display
# dateFormat:tz: "UTC"

# Enable dark mode
# theme:darkMode: false

# Maximum size for saved object requests
# savedObjects:perPage: 20

# Time picker quick ranges
# timepicker:quickRanges: []

# Time picker refresh intervals
# timepicker:refreshIntervalDefaults: {}

# Maximum number of documents to show in Discover
# discover:sampleSize: 500

# Maximum number of documents to show in context
# context:defaultSize: 5
# context:step: 5