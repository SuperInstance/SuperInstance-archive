# Logstash configuration for ActiveLog log processing
# Production-ready configuration with monitoring and security

# Settings file in YAML
# Settings can be specified either in hierarchical form, e.g.:
#   pipeline:
#     batch:
#       size: 125
#       delay: 50
# Or as flat keys:
#   pipeline.batch.size: 125
#   pipeline.batch.delay: 50

# ------------ Node identity ------------
node.name: logstash-${HOSTNAME}

# ------------ Data path ------------------
path.data: /usr/share/logstash/data

# ------------ Pipeline Settings --------------
pipeline.id: activelog
pipeline.workers: 4
pipeline.batch.size: 1000
pipeline.batch.delay: 50
pipeline.unsafe_shutdown: false
pipeline.plugin_classloaders: false
pipeline.separate_logs: false

# ------------ Pipeline Configuration Settings --------------
config.reload.automatic: true
config.reload.interval: 3s
config.debug: false
config.support_escapes: false

# ------------ Module Settings ---------------
modules:
  - name: netflow
    var.elasticsearch.hosts: "elasticsearch:9200"
    var.elasticsearch.username: "elastic"
    var.elasticsearch.password: "${ELASTICSEARCH_PASSWORD}"

# ------------ Queue Settings --------------
queue.type: persisted
queue.page_capacity: 64mb
queue.max_events: 0
queue.max_bytes: 1gb
queue.checkpoint.acks: 1024
queue.checkpoint.writes: 1024
queue.checkpoint.interval: 1000
queue.drain: false

# ------------ Dead Letter Queue Settings --------------
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: 2gb
dead_letter_queue.flush_interval: 5000
dead_letter_queue.retain.age: 7d

# ------------ Metrics Settings --------------
http.host: "0.0.0.0"
http.port: 9600-9700

# ------------ Debugging Settings --------------
log.level: info
path.logs: /usr/share/logstash/logs

# ------------ Other Settings --------------
xpack.monitoring.enabled: true
xpack.monitoring.elasticsearch.hosts: ["http://elasticsearch:9200"]
xpack.monitoring.elasticsearch.username: "logstash_system"
xpack.monitoring.elasticsearch.password: "${LOGSTASH_SYSTEM_PASSWORD}"

# ------------ Security Settings --------------
xpack.security.enabled: true