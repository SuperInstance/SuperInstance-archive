# Prometheus Configuration for ActiveLog Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'activelog-production'
    environment: 'prod'

# Rule files configuration
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations for different service types
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: 
        - 'node-exporter:9100'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # ActiveLog Core Services
  - job_name: 'activelog-api'
    static_configs:
      - targets:
        - 'activelog-api:8080'
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'activelog-web'
    static_configs:
      - targets:
        - 'activelog-web:3000'
    scrape_interval: 15s
    metrics_path: '/api/metrics'

  - job_name: 'activelog-auth'
    static_configs:
      - targets:
        - 'activelog-auth:8081'
    scrape_interval: 15s
    metrics_path: '/metrics'

  # ML Platform Services
  - job_name: 'ml-platform'
    static_configs:
      - targets:
        - 'ml-platform:8109'
    scrape_interval: 30s
    metrics_path: '/api/metrics'

  # Integration Controller
  - job_name: 'integration-controller'
    static_configs:
      - targets:
        - 'integration-controller:8200'
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Service Mesh Infrastructure
  - job_name: 'service-mesh'
    consul_sd_configs:
      - server: 'consul:8500'
        services: []
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_node]
        target_label: node
      - source_labels: [__meta_consul_tags]
        target_label: tags
      - source_labels: [__meta_consul_service_metadata_metrics_path]
        target_label: __metrics_path__
        regex: (.+)

  # Database Metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets:
        - 'postgres-exporter:9187'
    scrape_interval: 30s

  - job_name: 'mongodb-exporter'
    static_configs:
      - targets:
        - 'mongodb-exporter:9216'
    scrape_interval: 30s

  - job_name: 'redis-exporter'
    static_configs:
      - targets:
        - 'redis-exporter:9121'
    scrape_interval: 30s

  # Message Queue Metrics
  - job_name: 'rabbitmq-exporter'
    static_configs:
      - targets:
        - 'rabbitmq-exporter:9419'
    scrape_interval: 30s

  - job_name: 'kafka-exporter'
    static_configs:
      - targets:
        - 'kafka-exporter:9308'
    scrape_interval: 30s

  # Infrastructure Monitoring
  - job_name: 'cadvisor'
    static_configs:
      - targets:
        - 'cadvisor:8080'
    scrape_interval: 15s
    metrics_path: '/metrics'

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://activelog.com
        - https://api.activelog.com
        - https://app.activelog.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Custom Application Metrics
  - job_name: 'activelog-business-metrics'
    static_configs:
      - targets:
        - 'business-metrics-collector:8090'
    scrape_interval: 60s
    metrics_path: '/metrics'

  # Cost and Resource Tracking
  - job_name: 'cost-tracker'
    static_configs:
      - targets:
        - 'cost-tracker:8091'
    scrape_interval: 300s  # 5 minutes
    metrics_path: '/metrics'

  # Load Balancer Metrics
  - job_name: 'nginx-exporter'
    static_configs:
      - targets:
        - 'nginx-exporter:9113'
    scrape_interval: 15s

  # Kubernetes Metrics (if running on K8s)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      action: keep
      regex: true
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: kubernetes_namespace
    - source_labels: [__meta_kubernetes_pod_name]
      action: replace
      target_label: kubernetes_pod_name

# Remote write configuration for long-term storage
remote_write:
  - url: "http://thanos-receive:19291/api/v1/receive"
    queue_config:
      max_samples_per_send: 10000
      batch_send_deadline: 5s
      min_shards: 4
      max_shards: 200

# Storage configuration
storage:
  tsdb:
    retention.time: 15d
    retention.size: 50GB
    path: /prometheus/data
    wal-compression: true