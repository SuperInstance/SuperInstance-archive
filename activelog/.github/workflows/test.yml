name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POETRY_VERSION: '1.6.1'

jobs:
  # Job 1: Code Quality Checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r tests/requirements.txt
    
    - name: Lint with ruff
      run: |
        ruff check . --output-format=github
        ruff format --check .
    
    - name: Type checking with mypy
      run: |
        mypy activelog/ services/ --ignore-missing-imports --no-strict-optional
    
    - name: Security scan with bandit
      run: |
        bandit -r activelog/ services/ -f json -o bandit-report.json || true
    
    - name: Check for security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        pip-audit --format=json --output=pip-audit-report.json || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          pip-audit-report.json
    
    - name: Check commit messages (on PR)
      if: github.event_name == 'pull_request'
      run: |
        # Check if commit messages follow conventional commits
        echo "Checking commit messages..."
        git log --oneline HEAD~${{ github.event.pull_request.commits }}..HEAD

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r tests/requirements.txt
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ \
          -v \
          --cov=activelog \
          --cov=services \
          --cov-branch \
          --cov-report=xml \
          --cov-report=json \
          --cov-report=html:coverage-html \
          --cov-report=term-missing \
          --junit-xml=junit-unit.xml \
          --maxfail=5 \
          -m "unit and not slow"
      env:
        REDIS_URL: redis://localhost:6379/15
        DATABASE_URL: sqlite:///test.db
        ENVIRONMENT: test
    
    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: |
          junit-unit.xml
          coverage.xml
          coverage.json
          coverage-html/
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        files: coverage.xml
        name: unit-tests
        flags: unit
        fail_ci_if_error: false

  # Job 3: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: activelog_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d activelog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_health"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r tests/requirements.txt
    
    - name: Wait for services
      run: |
        # Wait for PostgreSQL
        timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'
        
        # Wait for Redis
        timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 2; done'
        
        # Wait for Elasticsearch
        timeout 120 bash -c 'until curl -f http://localhost:9200/_health; do sleep 5; done'
    
    - name: Set up test database
      run: |
        PGPASSWORD=test_pass createdb -h localhost -U test_user -p 5432 activelog_test || true
        # Run any necessary migrations here
        # python manage.py migrate
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ \
          -v \
          --cov=activelog \
          --cov=services \
          --cov-branch \
          --cov-append \
          --cov-report=xml \
          --cov-report=json \
          --cov-report=html:coverage-html-integration \
          --junit-xml=junit-integration.xml \
          --maxfail=3 \
          -m "integration and not slow"
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/activelog_test
        REDIS_URL: redis://localhost:6379/15
        ELASTICSEARCH_URL: http://localhost:9200
        ENVIRONMENT: test
        OPENAI_API_KEY: test-key-123
        AWS_ACCESS_KEY_ID: test-access-key
        AWS_SECRET_ACCESS_KEY: test-secret-key
        JWT_SECRET_KEY: test-jwt-secret
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          junit-integration.xml
          coverage.xml
          coverage.json
          coverage-html-integration/
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml
        name: integration-tests
        flags: integration
        fail_ci_if_error: false

  # Job 4: End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: activelog_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d activelog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r tests/requirements.txt
    
    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Install Playwright
      run: |
        playwright install --with-deps chromium firefox webkit
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Start application services
      run: |
        # Start backend services
        python -m uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000 &
        
        # Start frontend (if using Node.js server)
        cd frontend && npm run start &
        
        # Wait for services to be ready
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/activelog_test
        ENVIRONMENT: test
    
    - name: Run E2E tests
      run: |
        pytest tests/e2e/ \
          -v \
          --junit-xml=junit-e2e.xml \
          --maxfail=2 \
          -m "e2e and not slow"
      env:
        PLAYWRIGHT_BROWSER: chromium
        PLAYWRIGHT_HEADLESS: true
        BASE_URL: http://localhost:3000
        API_URL: http://localhost:8000
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          junit-e2e.xml
          tests/e2e/screenshots/
          tests/e2e/videos/
    
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/

  # Job 5: Load Tests (conditional)
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'load-test')
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: activelog_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d activelog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r tests/requirements.txt
    
    - name: Start application
      run: |
        python -m uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000 &
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
      env:
        DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/activelog_test
        REDIS_URL: redis://localhost:6379/15
        ENVIRONMENT: test
    
    - name: Run load tests
      run: |
        cd tests/load
        python run_load_tests.py --scenario light_load --users 20 --spawn-rate 5 --run-time 3m
    
    - name: Upload load test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: load-test-results
        path: tests/load/load_test_results/

  # Job 6: Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -r tests/requirements.txt
    
    - name: Run security tests
      run: |
        pytest tests/ \
          -v \
          --junit-xml=junit-security.xml \
          -m "security"
      env:
        ENVIRONMENT: test
    
    - name: Upload security test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-test-results
        path: junit-security.xml

  # Job 7: Coverage Report Aggregation
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install coverage
      run: |
        pip install coverage[toml]
    
    - name: Download coverage artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: "*-test-results*"
        merge-multiple: true
    
    - name: Combine coverage reports
      run: |
        coverage combine --append || true
        coverage report --show-missing --precision=2
        coverage html
        coverage xml
        coverage json
    
    - name: Coverage comment (on PR)
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 70
    
    - name: Upload combined coverage
      uses: actions/upload-artifact@v4
      with:
        name: combined-coverage-report
        path: |
          htmlcov/
          coverage.xml
          coverage.json
    
    - name: Upload final coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml
        name: combined-coverage
        flags: combined
        fail_ci_if_error: false

  # Job 8: Test Results Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, e2e-tests, security-tests]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: test-results
    
    - name: Generate test summary
      run: |
        echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Jobs Status" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Tests: ${{ needs.security-tests.result }}" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
        ls -la test-results/ >> $GITHUB_STEP_SUMMARY || echo "No artifacts found" >> $GITHUB_STEP_SUMMARY
        
        # Check if any critical jobs failed
        if [[ "${{ needs.unit-tests.result }}" == "failure" || "${{ needs.integration-tests.result }}" == "failure" ]]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Critical tests failed!**" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All critical tests passed!**" >> $GITHUB_STEP_SUMMARY
        fi

  # Job 9: Notify on failure (optional)
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, integration-tests, e2e-tests, security-tests]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Notify Slack on failure
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#dev-alerts'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: |
          🚨 Test failure in ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}