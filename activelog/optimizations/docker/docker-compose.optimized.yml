# Optimized Docker Compose configuration for ActiveLog
version: '3.8'

services:
  # Main application with optimizations
  activelog-app:
    build:
      context: ../..
      dockerfile: optimizations/docker/Dockerfile.optimized
      args:
        BUILDKIT_INLINE_CACHE: 1
      cache_from:
        - activelog:latest
    image: activelog:optimized
    container_name: activelog-app
    restart: unless-stopped
    
    environment:
      - DATABASE_URL=postgresql://activelog:${DB_PASSWORD:-secure_password}@postgres:5432/activelog
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKERS=4
      - MAX_CONNECTIONS=100
      - POOL_SIZE=20
      - COMPRESSION_ENABLED=true
      - CDN_ENABLED=true
    
    ports:
      - "8000:8000"
    
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    
    networks:
      - activelog-network
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    security_opt:
      - no-new-privileges:true
    
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Optimized PostgreSQL with performance tuning
  postgres:
    image: postgres:15-alpine
    container_name: activelog-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: activelog
      POSTGRES_USER: activelog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --encoding=UTF-8 --locale=en_US.UTF-8"
      
      # Performance optimizations
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_DEFAULT_STATISTICS_TARGET: 100
    
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c huge_pages=try
      -c max_connections=200
      -c max_wal_size=2GB
      -c min_wal_size=1GB
      -c log_statement=mod
      -c log_duration=on
      -c log_min_duration_statement=1000
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - activelog-network
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activelog -d activelog"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    
    security_opt:
      - no-new-privileges:true
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Optimized Redis with persistence
  redis:
    image: redis:7-alpine
    container_name: activelog-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
      --tcp-backlog 511
      --databases 16
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - activelog-network
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    security_opt:
      - no-new-privileges:true
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Optimized Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: activelog-elasticsearch
    restart: unless-stopped
    
    environment:
      - node.name=activelog-es
      - cluster.name=activelog-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      
      # Performance settings
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - "indices.memory.index_buffer_size=20%"
      - "indices.memory.min_index_buffer_size=96mb"
      - "thread_pool.write.queue_size=1000"
      - "thread_pool.search.queue_size=10000"
    
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    
    ports:
      - "9200:9200"
      - "9300:9300"
    
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - /etc/localtime:/etc/localtime:ro
    
    networks:
      - activelog-network
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    security_opt:
      - no-new-privileges:true
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # NGINX reverse proxy with optimizations
  nginx:
    image: nginx:alpine
    container_name: activelog-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    
    depends_on:
      - activelog-app
    
    networks:
      - activelog-network
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    security_opt:
      - no-new-privileges:true
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: activelog-prometheus
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    networks:
      - activelog-network
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: activelog-grafana
    restart: unless-stopped
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    
    ports:
      - "3000:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    
    depends_on:
      - prometheus
    
    networks:
      - activelog-network
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    
    profiles:
      - monitoring

# Networks
networks:
  activelog-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

# Volumes
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  
  elasticsearch-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/elasticsearch
  
  app-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/app
  
  app-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs
  
  nginx-cache:
    driver: local
  
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/nginx
  
  prometheus-data:
    driver: local
  
  grafana-data:
    driver: local