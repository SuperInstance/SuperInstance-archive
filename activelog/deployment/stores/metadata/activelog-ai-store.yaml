# ActiveLog AI Tools - App Store Metadata
# Professional AI toolkit for content creation and automation

app_info:
  name: "ActiveLog AI"
  bundle_id: "com.activelog.ai"
  category: "Graphics & Design"
  subcategory: "Productivity"
  content_rating: "12+"
  
  # Version information
  version: "1.0.0"
  build_number: "1"
  minimum_os_version:
    ios: "16.0"
    android: "8.0"
  
  # Pricing
  pricing_model: "freemium"
  base_price: "free"
  in_app_purchases: true

# App Store descriptions
descriptions:
  short_description: "Professional AI toolkit for image generation, text creation, voice synthesis, and video production with cutting-edge models."
  
  full_description: |
    ActiveLog AI is the most comprehensive AI toolkit for professionals, creators, and businesses. Access the latest AI models for image generation, text creation, voice synthesis, and video production - all in one powerful app.

    🎨 IMAGE GENERATION
    • DALL-E 3, Midjourney, and Stable Diffusion
    • Custom LoRA model training
    • Style transfer and image editing
    • Batch generation for efficiency
    • High-resolution outputs up to 4K
    • Commercial licensing included

    ✍️ TEXT GENERATION
    • GPT-4, Claude 3, and Llama models
    • Intelligent model routing for best results
    • Custom writing styles and tones
    • Multi-language support (50+ languages)
    • Code generation and debugging
    • Academic and technical writing

    🎤 VOICE SYNTHESIS
    • Natural-sounding voice generation
    • Voice cloning from audio samples
    • Multiple languages and accents
    • Emotional tone control
    • Batch audio processing
    • Professional voice-over quality

    🎬 VIDEO CREATION
    • Text-to-video generation
    • Image-to-video animation
    • Style transfer for videos
    • Custom frame rates and resolutions
    • Background music integration
    • Professional video effects

    🧠 SMART AI FEATURES
    • Cost optimization across providers
    • Local vs cloud processing
    • Result caching to save money
    • Batch processing for efficiency
    • Custom model marketplace
    • API integration support

    💰 TRANSPARENT PRICING
    • Pay-per-use with Compute Credits (CC)
    • No hidden fees or subscriptions
    • Real-time cost estimation
    • Bulk discounts available
    • Free tier with generous limits
    • Enterprise pricing available

    🛡️ PRIVACY & SECURITY
    • Local processing when possible
    • Encrypted cloud storage
    • No data retention policies
    • GDPR and CCPA compliant
    • Business-grade security
    • API key management

    ⚡ PERFORMANCE
    • GPU acceleration support
    • Optimized for mobile devices
    • Background processing
    • Progressive downloads
    • Offline capability for local models
    • Real-time progress tracking

    🔧 INTEGRATIONS
    • Adobe Creative Suite plugins
    • Figma and Sketch integration
    • Slack and Discord bots
    • API for custom applications
    • Webhook notifications
    • Cloud storage sync

    Perfect for:
    • Graphic designers and artists
    • Content creators and marketers
    • Video producers and editors
    • Writers and copywriters
    • Developers and programmers
    • Social media managers
    • Agencies and studios
    • Entrepreneurs and startups

    Supported AI Providers:
    • OpenAI (GPT-4, DALL-E 3)
    • Anthropic (Claude 3)
    • Stability AI (Stable Diffusion)
    • Midjourney (via API)
    • ElevenLabs (Voice)
    • RunwayML (Video)
    • Local models (Llama, etc.)

    Start creating with AI today!

  whats_new: |
    🎉 ActiveLog AI 1.0 Launch!

    🆕 Revolutionary Features:
    • Multi-provider AI model access
    • Real-time cost optimization
    • Professional-grade outputs
    • Local model support
    • Custom LoRA training
    • Voice cloning technology

    🎨 Image Generation:
    • DALL-E 3 integration
    • Stable Diffusion XL support
    • Custom style training
    • Batch processing capabilities

    ✨ Text & Voice:
    • GPT-4 and Claude 3 access
    • Natural voice synthesis
    • Voice cloning from samples
    • Multi-language support

    💰 Smart Pricing:
    • Transparent cost tracking
    • Automatic provider optimization
    • Bulk processing discounts
    • Free tier included

    Welcome to the future of AI-powered creativity!

