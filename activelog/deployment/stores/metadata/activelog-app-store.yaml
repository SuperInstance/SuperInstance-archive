# ActiveLog Main App - App Store Metadata
# Comprehensive logging and productivity application

app_info:
  name: "ActiveLog"
  bundle_id: "com.activelog.app"
  category: "Productivity"
  content_rating: "4+"
  
  # Version information
  version: "1.0.0"
  build_number: "1"
  minimum_os_version:
    ios: "15.0"
    android: "7.0"
  
  # Pricing
  pricing_model: "freemium"
  base_price: "free"
  in_app_purchases: true

# App Store descriptions
descriptions:
  short_description: "Professional activity logging and productivity tracking with powerful analytics and team collaboration."
  
  full_description: |
    ActiveLog is the ultimate productivity companion for professionals, teams, and organizations who want to track, analyze, and optimize their daily activities with precision and insight.

    🚀 POWERFUL ACTIVITY TRACKING
    • Log any activity with customizable templates
    • Time tracking with automatic reminders
    • Location-based logging with GPS integration
    • Voice memo recording and transcription
    • Photo and document attachments
    • QR code scanning for quick logging

    📊 ADVANCED ANALYTICS
    • Beautiful visualizations and charts
    • Productivity trends and patterns
    • Goal setting and progress tracking
    • Custom reports and exports
    • Performance insights and recommendations
    • Time allocation analysis

    👥 TEAM COLLABORATION
    • Share logs with team members
    • Real-time collaboration features
    • Team analytics and dashboards
    • Project tracking and management
    • Role-based access control
    • Integration with popular workflow tools

    🔧 POWERFUL INTEGRATIONS
    • Calendar sync (Google, Outlook, Apple)
    • Task management tools (Asana, Trello, Notion)
    • Communication platforms (Slack, Teams)
    • File storage services (Drive, Dropbox, OneDrive)
    • Time tracking tools (Toggl, RescueTime)
    • CRM systems (Salesforce, HubSpot)

    ⚡ SMART FEATURES
    • AI-powered activity suggestions
    • Automatic categorization and tagging
    • Smart reminders and notifications
    • Offline mode with sync
    • Dark mode support
    • Cross-platform synchronization

    🛡️ PRIVACY & SECURITY
    • End-to-end encryption
    • GDPR and CCPA compliant
    • Biometric authentication
    • Local data storage options
    • Zero-knowledge architecture
    • SOC 2 Type II certified

    💎 PREMIUM FEATURES
    • Unlimited log entries
    • Advanced analytics and reporting
    • Team collaboration tools
    • Priority customer support
    • Custom integrations
    • White-label options

    Perfect for:
    • Consultants and freelancers
    • Project managers and team leads
    • Sales professionals
    • Healthcare workers
    • Researchers and analysts
    • Students and educators
    • Remote workers
    • Anyone who wants to optimize their productivity

    Start your productivity journey today with ActiveLog!

  whats_new: |
    🎉 Welcome to ActiveLog 1.0!

    ✨ Brand new features:
    • Beautiful Material Design 3 interface
    • Voice recording with AI transcription
    • Smart activity suggestions
    • Real-time team collaboration
    • Advanced analytics dashboard
    • Cross-platform synchronization

    🚀 Performance improvements:
    • 50% faster app startup
    • Optimized battery usage
    • Improved offline capabilities
    • Enhanced data synchronization

    🛡️ Security enhancements:
    • Biometric authentication
    • End-to-end encryption
    • Enhanced privacy controls

    We're excited to help you transform your productivity!

