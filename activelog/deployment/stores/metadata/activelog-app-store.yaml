    microphone: "Voice memo recording"
    location: "Location-based activity logging"
    photos: "Image attachments for logs"
    calendar: "Calendar integration and sync"
    contacts: "Team member sharing"
    
  age_rating:
    ios: "4+"
    android: "Everyone"
    
