apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: activelog-gateway
  namespace: activelog
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*.activelog.com"
    - "activelog.com"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: activelog-tls
    hosts:
    - "*.activelog.com"
    - "activelog.com"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: activelog-vs
  namespace: activelog
spec:
  hosts:
  - "*.activelog.com"
  - "activelog.com"
  gateways:
  - activelog-gateway
  http:
  # API Gateway routes
  - match:
    - uri:
        prefix: /api/v1/
    - headers:
        host:
          exact: api.activelog.com
    route:
    - destination:
        host: api-gateway
        port:
          number: 8000
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 100ms
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,reset,connect-failure,refused-stream
    timeout: 10s
  
  # Auth Service routes
  - match:
    - uri:
        prefix: /auth/
    - headers:
        host:
          exact: auth.activelog.com
    route:
    - destination:
        host: auth
        port:
          number: 8001
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 5s
  
  # GraphQL routes
  - match:
    - uri:
        prefix: /graphql
    - headers:
        host:
          exact: graphql.activelog.com
    route:
    - destination:
        host: graphql
        port:
          number: 8002
    timeout: 30s
  
  # AI Services routes
  - match:
    - uri:
        prefix: /ai/
    route:
    - destination:
        host: ai-orchestrator
        port:
          number: 8030
      weight: 100
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 200ms
    retries:
      attempts: 2
      perTryTimeout: 30s
    timeout: 60s
  
  # Video Processing routes
  - match:
    - uri:
        prefix: /video/
    route:
    - destination:
        host: video-pipeline
        port:
          number: 8040
    timeout: 300s  # 5 minutes for video processing
  
  # Gaming Platform routes
  - match:
    - uri:
        prefix: /gaming/
    route:
    - destination:
        host: gaming-platform
        port:
          number: 8070
    corsPolicy:
      allowOrigins:
      - exact: https://game.activelog.com
      allowMethods:
      - POST
      - GET
      - OPTIONS
      - PUT
      - DELETE
      allowHeaders:
      - authorization
      - content-type
      - x-requested-with
      allowCredentials: true
  
  # Default route to main app
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: api-gateway
        port:
          number: 8000
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: activelog-destination-rules
  namespace: activelog
spec:
  host: "*.activelog.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 64
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
    circuitBreaker:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway-dr
  namespace: activelog
spec:
  host: api-gateway
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 128
        http2MaxRequests: 200
        maxRequestsPerConnection: 20
        maxRetries: 3
        idleTimeout: 90s
    circuitBreaker:
      consecutiveGatewayErrors: 3
      interval: 15s
      baseEjectionTime: 15s
      maxEjectionPercent: 30
  portLevelSettings:
  - port:
      number: 8000
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http1MaxPendingRequests: 128
        maxRequestsPerConnection: 20
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ai-services-dr
  namespace: activelog
spec:
  host: "ai-*"
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 30s
      http:
        http1MaxPendingRequests: 32
        http2MaxRequests: 50
        maxRequestsPerConnection: 5
        idleTimeout: 120s
    circuitBreaker:
      consecutiveGatewayErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: database-dr
  namespace: activelog
spec:
  host: postgres
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 10s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        maxRequestsPerConnection: 1
    circuitBreaker:
      consecutiveGatewayErrors: 5
      interval: 60s
      baseEjectionTime: 120s