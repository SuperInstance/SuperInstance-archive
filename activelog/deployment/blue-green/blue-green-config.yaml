# Blue-Green Deployment Configuration for ActiveLog Platform

apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-green-config
  namespace: activelog
data:
  # Blue-Green deployment settings
  traffic-split-duration: "300s"  # 5 minutes for gradual traffic shift
  health-check-interval: "30s"
  rollback-threshold: "5%"  # Error rate threshold for automatic rollback
  monitoring-window: "10m"  # Post-deployment monitoring window
  canary-percentage: "10"   # Initial canary traffic percentage
  
  # Environment labels
  blue-label: "environment=blue"
  green-label: "environment=green"
  
  # Deployment strategy
  strategy: "blue-green"  # Options: blue-green, canary, rolling
  
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway-rollout
  namespace: activelog
spec:
  replicas: 5
  strategy:
    blueGreen:
      activeService: api-gateway-active
      previewService: api-gateway-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates:
        - templateName: success-rate
        args:
        - name: service-name
          value: api-gateway-preview.activelog.svc.cluster.local
      postPromotionAnalysis:
        templates:
        - templateName: success-rate
        args:
        - name: service-name
          value: api-gateway-active.activelog.svc.cluster.local
      previewReplicaCount: 1
      promotionPolicy:
        stepsEnabled: true
      steps:
      - setWeight: 10
      - pause:
          duration: 300s  # 5 minutes
      - analysis:
          templates:
          - templateName: success-rate
          - templateName: latency
          args:
          - name: service-name
            value: api-gateway-preview.activelog.svc.cluster.local
      - setWeight: 25
      - pause:
          duration: 300s
      - setWeight: 50
      - pause:
          duration: 300s
      - setWeight: 75
      - pause:
          duration: 300s
      - setWeight: 100
      - pause:
          duration: 600s  # 10 minutes final verification
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-gateway
        image: activelog/api-gateway:latest
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            memory: 256Mi
            cpu: 200m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-active
  namespace: activelog
  labels:
    app: api-gateway
    role: active
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-preview
  namespace: activelog
  labels:
    app: api-gateway
    role: preview
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
---
# Analysis Templates for Blue-Green Validation
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: activelog
spec:
  args:
  - name: service-name
  metrics:
  - name: success-rate
    interval: 60s
    count: 5
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus.activelog-monitoring:9090
        query: |
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name=~"{{args.service-name}}",response_code!~"5.*"}[5m]
          )) / 
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name=~"{{args.service-name}}"}[5m]
          ))
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: latency
  namespace: activelog
spec:
  args:
  - name: service-name
  metrics:
  - name: latency-p99
    interval: 60s
    count: 5
    successCondition: result[0] <= 1000  # 1 second
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus.activelog-monitoring:9090
        query: |
          histogram_quantile(0.99,
            sum(irate(
              istio_request_duration_milliseconds_bucket{reporter="destination",destination_service_name=~"{{args.service-name}}"}[5m]
            )) by (le)
          )
  - name: latency-p95
    interval: 60s
    count: 5
    successCondition: result[0] <= 500  # 500ms
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus.activelog-monitoring:9090
        query: |
          histogram_quantile(0.95,
            sum(irate(
              istio_request_duration_milliseconds_bucket{reporter="destination",destination_service_name=~"{{args.service-name}}"}[5m]
            )) by (le)
          )
---
# Istio VirtualService for Blue-Green Traffic Management
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-bg
  namespace: activelog
spec:
  hosts:
  - api-gateway
  http:
  - match:
    - headers:
        x-preview:
          exact: "true"
    route:
    - destination:
        host: api-gateway-preview
      weight: 100
  - route:
    - destination:
        host: api-gateway-active
      weight: 100
---
# Flagger Canary for Automated Blue-Green
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: api-gateway-canary
  namespace: activelog
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  progressDeadlineSeconds: 60
  service:
    port: 8000
    targetPort: 8000
    gateways:
    - activelog-gateway
    hosts:
    - api.activelog.com
  analysis:
    interval: 1m
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
    - name: request-success-rate
      thresholdRange:
        min: 99
      interval: 1m
    - name: request-duration
      thresholdRange:
        max: 500
      interval: 1m
    - name: error-rate
      thresholdRange:
        max: 1
      interval: 1m
    webhooks:
    - name: acceptance-test
      type: pre-rollout
      url: http://flagger-loadtester.test/
      timeout: 30s
      metadata:
        type: bash
        cmd: "curl -sd 'test' http://api-gateway-canary:8000/health | grep -q 'ok'"
    - name: load-test
      url: http://flagger-loadtester.test/
      timeout: 5s
      metadata:
        cmd: "hey -z 10m -q 10 -c 2 http://api-gateway-canary.activelog:8000/health"
---
# Blue-Green Deployment Script ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-green-scripts
  namespace: activelog
data:
  deploy.sh: |
    #!/bin/bash
    set -euo pipefail
    
    # Blue-Green deployment script for ActiveLog
    
    NAMESPACE="${1:-activelog}"
    NEW_VERSION="${2:-latest}"
    SERVICE_NAME="${3:-api-gateway}"
    
    echo "Starting blue-green deployment for $SERVICE_NAME"
    echo "Namespace: $NAMESPACE"
    echo "New Version: $NEW_VERSION"
    
    # Determine current active environment
    CURRENT_ACTIVE=$(kubectl get service "${SERVICE_NAME}-active" -n "$NAMESPACE" -o jsonpath='{.spec.selector.version}' || echo "blue")
    NEW_ACTIVE=$([ "$CURRENT_ACTIVE" = "blue" ] && echo "green" || echo "blue")
    
    echo "Current active: $CURRENT_ACTIVE"
    echo "Deploying to: $NEW_ACTIVE"
    
    # Update deployment with new version
    kubectl set image deployment/"$SERVICE_NAME" "$SERVICE_NAME"="activelog/$SERVICE_NAME:$NEW_VERSION" -n "$NAMESPACE"
    kubectl patch deployment "$SERVICE_NAME" -n "$NAMESPACE" -p '{"spec":{"template":{"metadata":{"labels":{"version":"'$NEW_ACTIVE'"}}}}}'
    
    # Wait for rollout
    kubectl rollout status deployment/"$SERVICE_NAME" -n "$NAMESPACE" --timeout=300s
    
    # Update preview service
    kubectl patch service "${SERVICE_NAME}-preview" -n "$NAMESPACE" -p '{"spec":{"selector":{"version":"'$NEW_ACTIVE'"}}}'
    
    # Run health checks
    echo "Running health checks..."
    PREVIEW_IP=$(kubectl get service "${SERVICE_NAME}-preview" -n "$NAMESPACE" -o jsonpath='{.spec.clusterIP}')
    
    for i in {1..30}; do
        if curl -sf "http://$PREVIEW_IP:8000/health" > /dev/null; then
            echo "Health check passed"
            break
        fi
        echo "Health check attempt $i failed, retrying..."
        sleep 10
    done
    
    # Switch traffic
    echo "Switching traffic to $NEW_ACTIVE environment"
    kubectl patch service "${SERVICE_NAME}-active" -n "$NAMESPACE" -p '{"spec":{"selector":{"version":"'$NEW_ACTIVE'"}}}'
    
    echo "Blue-green deployment completed successfully"
  
  rollback.sh: |
    #!/bin/bash
    set -euo pipefail
    
    NAMESPACE="${1:-activelog}"
    SERVICE_NAME="${2:-api-gateway}"
    
    echo "Rolling back $SERVICE_NAME in $NAMESPACE"
    
    # Get current active version
    CURRENT_ACTIVE=$(kubectl get service "${SERVICE_NAME}-active" -n "$NAMESPACE" -o jsonpath='{.spec.selector.version}')
    ROLLBACK_TO=$([ "$CURRENT_ACTIVE" = "blue" ] && echo "green" || echo "blue")
    
    echo "Rolling back from $CURRENT_ACTIVE to $ROLLBACK_TO"
    
    # Switch active service back
    kubectl patch service "${SERVICE_NAME}-active" -n "$NAMESPACE" -p '{"spec":{"selector":{"version":"'$ROLLBACK_TO'"}}}'
    
    echo "Rollback completed"
  
  health-check.sh: |
    #!/bin/bash
    set -euo pipefail
    
    SERVICE_ENDPOINT="${1:-http://api-gateway:8000}"
    TIMEOUT="${2:-300}"
    
    echo "Running health checks for $SERVICE_ENDPOINT"
    
    start_time=$(date +%s)
    
    while true; do
        current_time=$(date +%s)
        elapsed=$((current_time - start_time))
        
        if [ $elapsed -gt $TIMEOUT ]; then
            echo "Health check timed out after ${TIMEOUT}s"
            exit 1
        fi
        
        # Test health endpoint
        if curl -sf "$SERVICE_ENDPOINT/health" > /dev/null; then
            echo "Health check passed"
            
            # Test ready endpoint
            if curl -sf "$SERVICE_ENDPOINT/ready" > /dev/null; then
                echo "Readiness check passed"
                exit 0
            fi
        fi
        
        echo "Health check failed, retrying in 10s..."
        sleep 10
    done
---
# Job for Blue-Green Deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: blue-green-deploy
  namespace: activelog
spec:
  template:
    spec:
      containers:
      - name: deployer
        image: bitnami/kubectl:latest
        command: ["/bin/bash"]
        args: ["/scripts/deploy.sh", "activelog", "$(NEW_VERSION)", "$(SERVICE_NAME)"]
        env:
        - name: NEW_VERSION
          value: "latest"
        - name: SERVICE_NAME
          value: "api-gateway"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: blue-green-scripts
          defaultMode: 0755
      restartPolicy: OnFailure
  backoffLimit: 3
---
# CronJob for automated blue-green health monitoring
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blue-green-health-monitor
  namespace: activelog
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: health-monitor
            image: curlimages/curl:latest
            command: ["/bin/sh"]
            args:
            - -c
            - |
              # Check active service health
              ACTIVE_IP=$(kubectl get service api-gateway-active -n activelog -o jsonpath='{.spec.clusterIP}')
              
              if ! curl -sf "http://$ACTIVE_IP:8000/health" > /dev/null; then
                echo "Active service health check failed!"
                # Trigger alert/notification
                exit 1
              fi
              
              echo "Active service health check passed"
          restartPolicy: OnFailure