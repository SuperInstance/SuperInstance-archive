# GitHub Actions CI/CD Pipeline for ActiveLog Platform
name: ActiveLog Production Deployment Pipeline

on:
  push:
    branches: [main, production]
    paths:
    - 'services/**'
    - 'deployment/**'
    - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
    - 'services/**'
    - 'deployment/**'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: activelog
  KUBERNETES_NAMESPACE: activelog
  HELM_VERSION: v3.12.0
  KUBECTL_VERSION: v1.28.0
  ISTIOCTL_VERSION: 1.19.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Security scanning and code quality
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run Semgrep security scanner
      uses: returntocorp/semgrep-action@v1
      with:
        publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Build and test services
  build-matrix:
    name: Build Service Images
    runs-on: ubuntu-latest
    needs: security-scan
    strategy:
      matrix:
        service:
        # Core services
        - { name: "api-gateway", path: "services/api-gateway", port: 8000 }
        - { name: "auth", path: "services/auth", port: 8001 }
        - { name: "graphql", path: "services/graphql", port: 8002 }
        # Data services
        - { name: "data-manager", path: "services/data-manager", port: 8010 }
        - { name: "data-export", path: "services/data-export", port: 8011 }
        - { name: "batch-import", path: "services/batch-import", port: 8012 }
        - { name: "metadata", path: "services/metadata", port: 8013 }
        - { name: "file-processor", path: "services/file_processor", port: 8014 }
        # Sync services
        - { name: "sync-engine", path: "services/sync-engine", port: 8020 }
        - { name: "sync-v2", path: "services/sync-v2", port: 8021 }
        - { name: "file-sync", path: "services/file-sync", port: 8022 }
        - { name: "p2p-sync", path: "services/p2p-sync", port: 8023 }
        - { name: "file-watcher", path: "services/file-watcher", port: 8024 }
        # AI services
        - { name: "ai-orchestrator", path: "services/ai_orchestrator", port: 8030 }
        - { name: "ai-tools", path: "services/ai-tools", port: 8031 }
        - { name: "ml-pipeline", path: "services/ml-pipeline", port: 8032 }
        - { name: "predictive", path: "services/predictive", port: 8033 }
        - { name: "predictive-ai", path: "services/predictive-ai", port: 8034 }
        - { name: "document-ai", path: "services/document-ai", port: 8035 }
        - { name: "emotional-ai", path: "services/emotional-ai", port: 8036 }
        - { name: "education-ai", path: "services/education-ai", port: 8037 }
        - { name: "cognitive", path: "services/cognitive", port: 8038 }
        - { name: "social-ai", path: "services/social-ai", port: 8039 }
        # Media services
        - { name: "video-pipeline", path: "services/video-pipeline", port: 8040 }
        - { name: "video-processor", path: "services/video-processor", port: 8041 }
        - { name: "creative-suite", path: "services/creative-suite", port: 8042 }
        # Gaming services
        - { name: "gaming-platform", path: "services/gaming-platform", port: 8070 }
        - { name: "dmlog-core", path: "services/dmlog-core", port: 8071 }
        - { name: "dmlog-characters", path: "services/dmlog-characters", port: 8072 }
        - { name: "dmlog-battle", path: "services/dmlog-battle", port: 8073 }
        - { name: "dmlog-session", path: "services/dmlog-session", port: 8074 }
        - { name: "dmlog-world", path: "services/dmlog-world", port: 8075 }
        - { name: "dmlog-marketplace", path: "services/dmlog-marketplace", port: 8076 }
        - { name: "dmlog-ai-dm", path: "services/dmlog-ai-dm", port: 8077 }
        - { name: "dmlog-player", path: "services/dmlog-player", port: 8078 }
        - { name: "dmlog-templates", path: "services/dmlog-templates", port: 8079 }
        - { name: "dmlog-converter", path: "services/dmlog-converter", port: 8080 }
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check if service changed
      id: changes
      run: |
        if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^${{ matrix.service.path }}/"; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Set up Docker Buildx
      if: steps.changes.outputs.changed == 'true' || github.ref == 'refs/heads/main'
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      if: steps.changes.outputs.changed == 'true' || github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      if: steps.changes.outputs.changed == 'true' || github.ref == 'refs/heads/main'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      if: steps.changes.outputs.changed == 'true' || github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.path }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          SERVICE_PORT=${{ matrix.service.port }}
          BUILD_DATE=${{ github.run_number }}
          GIT_SHA=${{ github.sha }}
    
    - name: Run security scan on image
      if: steps.changes.outputs.changed == 'true' || github.ref == 'refs/heads/main'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
        format: 'sarif'
        output: '${{ matrix.service.name }}-trivy-results.sarif'
    
    - name: Upload image scan results
      if: steps.changes.outputs.changed == 'true' || github.ref == 'refs/heads/main'
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: '${{ matrix.service.name }}-trivy-results.sarif'

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-matrix
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: activelog_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install test dependencies
      run: |
        npm install -g newman
        pip install pytest pytest-asyncio httpx
    
    - name: Run API tests
      run: |
        # Add integration test commands here
        echo "Running integration tests..."
    
    - name: Run load tests
      run: |
        # Add load test commands here
        echo "Running load tests..."

  # Staging deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-matrix, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
    
    - name: Install Helm
      run: |
        curl -LO "https://get.helm.sh/helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz"
        tar -zxvf helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz
        sudo mv linux-amd64/helm /usr/local/bin/
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
        kubectl config use-context staging
    
    - name: Deploy to staging
      run: |
        # Update image tags in deployments
        cd deployment/k8s
        
        # Deploy infrastructure first
        kubectl apply -f namespace.yaml
        kubectl apply -f configmaps.yaml
        kubectl apply -f database/
        
        # Wait for database to be ready
        kubectl wait --for=condition=ready pod -l app=activelog-postgres -n activelog --timeout=300s
        
        # Deploy services
        for service_file in services/*.yaml; do
          # Update image tags to use current SHA
          sed -i "s|:latest|:${{ github.sha }}|g" $service_file
          kubectl apply -f $service_file
        done
        
        # Deploy Istio configuration
        kubectl apply -f ../istio/
        
        # Wait for rollout
        kubectl rollout status deployment -n activelog --timeout=600s
    
    - name: Run staging tests
      run: |
        # Add staging test commands
        echo "Running staging tests..."
    
    - name: Notify on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Production deployment (Blue-Green)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/production'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        curl -LO "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
        curl -LO "https://get.helm.sh/helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz"
        tar -zxvf helm-${{ env.HELM_VERSION }}-linux-amd64.tar.gz
        sudo mv linux-amd64/helm /usr/local/bin/
        
        curl -L https://istio.io/downloadIstio | ISTIO_VERSION=${{ env.ISTIOCTL_VERSION }} sh -
        sudo mv istio-${{ env.ISTIOCTL_VERSION }}/bin/istioctl /usr/local/bin/
    
    - name: Configure kubectl for production
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
        kubectl config use-context production
    
    - name: Create Blue-Green deployment
      run: |
        cd deployment/k8s
        
        # Determine current active environment
        CURRENT_ENV=$(kubectl get service api-gateway -n activelog -o jsonpath='{.spec.selector.environment}' || echo "blue")
        TARGET_ENV=$([ "$CURRENT_ENV" = "blue" ] && echo "green" || echo "blue")
        
        echo "Current environment: $CURRENT_ENV"
        echo "Target environment: $TARGET_ENV"
        echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV
        
        # Update manifests for target environment
        for file in services/*.yaml; do
          sed -i "s|:latest|:${{ github.sha }}|g" $file
          sed -i "s|environment: v1|environment: $TARGET_ENV|g" $file
          sed -i "s|version: v1|version: $TARGET_ENV|g" $file
          sed -i "s|app: activelog-|app: activelog-$TARGET_ENV-|g" $file
        done
        
        # Deploy target environment
        kubectl apply -f services/
        
        # Wait for deployment
        kubectl wait --for=condition=available deployment -l environment=$TARGET_ENV -n activelog --timeout=900s
    
    - name: Run production smoke tests
      run: |
        # Test the green environment before switching traffic
        TARGET_ENV=${{ env.TARGET_ENV }}
        
        # Get service endpoints for testing
        API_ENDPOINT=$(kubectl get service api-gateway-$TARGET_ENV -n activelog -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        # Run smoke tests
        curl -f http://$API_ENDPOINT:8000/health || exit 1
        curl -f http://$API_ENDPOINT:8000/ready || exit 1
        
        # Add more comprehensive tests
        echo "Running comprehensive production smoke tests..."
    
    - name: Switch traffic (Blue-Green cutover)
      run: |
        TARGET_ENV=${{ env.TARGET_ENV }}
        
        # Update service selectors to point to new environment
        kubectl patch service api-gateway -n activelog -p '{"spec":{"selector":{"environment":"'$TARGET_ENV'"}}}'
        
        # Update Istio VirtualService for gradual traffic shift
        kubectl patch virtualservice activelog-vs -n activelog --type='merge' -p='
        {
          "spec": {
            "http": [
              {
                "match": [{"uri": {"prefix": "/"}}],
                "route": [
                  {"destination": {"host": "api-gateway"}, "weight": 100}
                ]
              }
            ]
          }
        }'
        
        echo "Traffic switched to $TARGET_ENV environment"
    
    - name: Monitor deployment
      run: |
        # Monitor for 10 minutes after cutover
        echo "Monitoring deployment for 10 minutes..."
        
        for i in {1..60}; do
          # Check error rate
          ERROR_RATE=$(kubectl exec -n istio-system deployment/prometheus -- \
            promtool query instant 'rate(istio_requests_total{response_code=~"5.*"}[5m]) / rate(istio_requests_total[5m]) * 100' | \
            grep -oE '[0-9]+\.[0-9]+' | head -1 || echo "0")
          
          if (( $(echo "$ERROR_RATE > 5" | bc -l) )); then
            echo "High error rate detected: $ERROR_RATE%"
            echo "ROLLBACK_REQUIRED=true" >> $GITHUB_ENV
            break
          fi
          
          sleep 10
        done
    
    - name: Rollback if necessary
      if: env.ROLLBACK_REQUIRED == 'true'
      run: |
        echo "Rolling back due to high error rate"
        
        # Switch traffic back to previous environment
        PREVIOUS_ENV=$([ "${{ env.TARGET_ENV }}" = "blue" ] && echo "green" || echo "blue")
        kubectl patch service api-gateway -n activelog -p '{"spec":{"selector":{"environment":"'$PREVIOUS_ENV'"}}}'
        
        # Send alert
        curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"🚨 Production rollback executed for ActiveLog deployment"}' \
          ${{ secrets.SLACK_WEBHOOK }}
        
        exit 1
    
    - name: Cleanup old environment
      if: env.ROLLBACK_REQUIRED != 'true'
      run: |
        # Remove old environment after successful deployment
        OLD_ENV=$([ "${{ env.TARGET_ENV }}" = "blue" ] && echo "green" || echo "blue")
        
        # Wait 30 minutes before cleanup to allow for manual verification
        echo "Waiting 30 minutes before cleaning up old environment..."
        sleep 1800
        
        kubectl delete deployment -l environment=$OLD_ENV -n activelog
        kubectl delete service -l environment=$OLD_ENV -n activelog
    
    - name: Notify success
      if: env.ROLLBACK_REQUIRED != 'true'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: "✅ ActiveLog production deployment completed successfully"

  # Cleanup and reporting
  post-deployment:
    name: Post Deployment Tasks
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: Generate deployment report
      run: |
        echo "# ActiveLog Deployment Report" > deployment-report.md
        echo "- **Commit**: ${{ github.sha }}" >> deployment-report.md
        echo "- **Branch**: ${{ github.ref_name }}" >> deployment-report.md
        echo "- **Trigger**: ${{ github.event_name }}" >> deployment-report.md
        echo "- **Status**: ${{ job.status }}" >> deployment-report.md
        echo "- **Timestamp**: $(date -u)" >> deployment-report.md
    
    - name: Archive deployment artifacts
      uses: actions/upload-artifact@v3
      with:
        name: deployment-artifacts
        path: |
          deployment-report.md
          deployment/k8s/
        retention-days: 90