apiVersion: apps/v1
kind: Deployment
metadata:
  name: education-ai
  namespace: activelog
  labels:
    app: activelog-education-ai
    component: ai
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: activelog-education-ai
  template:
    metadata:
      labels:
        app: activelog-education-ai
        component: ai
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
        sidecar.istio.io/inject: 'true'
    spec:
      serviceAccountName: activelog-education-ai
      containers:
      - name: education-ai
        image: activelog/education-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8037
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: '8037'
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: activelog-config
              key: NODE_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: activelog-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: 768Mi
            cpu: 400m
          limits:
            memory: 1152Mi
            cpu: 600m
        livenessProbe:
          httpGet:
            path: /health
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: education-ai
  namespace: activelog
  labels:
    app: activelog-education-ai
    component: ai
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8037
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: activelog-education-ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: activelog-education-ai
  namespace: activelog
  labels:
    app: activelog-education-ai
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: education-ai-hpa
  namespace: activelog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: education-ai
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: education-ai-pdb
  namespace: activelog
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: activelog-education-ai
