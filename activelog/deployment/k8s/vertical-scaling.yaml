# Vertical Pod Autoscaling Configuration for Resource-Intensive Services
# VPA provides resource recommendations and can automatically adjust CPU/Memory requests

# VPA for AI/ML Services (require dynamic resource adjustment)
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ai-orchestrator-vpa
  namespace: activelog
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-orchestrator
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: ai-orchestrator
      maxAllowed:
        cpu: 4
        memory: 8Gi
      minAllowed:
        cpu: 100m
        memory: 128Mi
      controlledResources: ["cpu", "memory"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ml-pipeline-vpa
  namespace: activelog
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-pipeline
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: ml-pipeline
      maxAllowed:
        cpu: 4
        memory: 16Gi
      minAllowed:
        cpu: 200m
        memory: 512Mi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: predictive-ai-vpa
  namespace: activelog
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: predictive-ai
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: predictive-ai
      maxAllowed:
        cpu: 6
        memory: 12Gi
      minAllowed:
        cpu: 200m
        memory: 512Mi

