# Cluster Autoscaler Configuration for ActiveLog Platform
# Automatically scales cluster nodes based on pod resource demands

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8085'
    spec:
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      serviceAccountName: cluster-autoscaler
      containers:
      - image: k8s.gcr.io/autoscaling/cluster-autoscaler:v1.21.0
        name: cluster-autoscaler
        resources:
          limits:
            cpu: 100m
            memory: 300Mi
          requests:
            cpu: 100m
            memory: 300Mi
        command:
        - ./cluster-autoscaler
        - --v=4
        - --stderrthreshold=info
        - --cloud-provider=aws  # Change based on your cloud provider
        - --skip-nodes-with-local-storage=false
        - --expander=least-waste
        - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/activelog
        - --balance-similar-node-groups
        - --skip-nodes-with-system-pods=false
        - --scale-down-enabled=true
        - --scale-down-delay-after-add=10m
        - --scale-down-unneeded-time=10m
        - --scale-down-delay-after-delete=10s
        - --scale-down-delay-after-failure=3m
        - --scale-down-utilization-threshold=0.5
        - --max-node-provision-time=15m
        - --max-empty-bulk-delete=10
        - --max-graceful-termination-sec=600
        env:
        - name: AWS_REGION
          value: us-west-2  # Change based on your region
        volumeMounts:
        - name: ssl-certs
          mountPath: /etc/ssl/certs/ca-certificates.crt
          readOnly: true
        imagePullPolicy: "Always"
      volumes:
      - name: ssl-certs
        hostPath:
          path: "/etc/ssl/certs/ca-certificates.crt"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
rules:
- apiGroups: [""]
  resources: ["events", "endpoints"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["pods/eviction"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["endpoints"]
  resourceNames: ["cluster-autoscaler"]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["watch", "list", "get", "update"]
- apiGroups: [""]
  resources: ["namespaces", "pods", "services", "replicationcontrollers", "persistentvolumeclaims", "persistentvolumes"]
  verbs: ["watch", "list", "get"]
- apiGroups: ["extensions"]
  resources: ["replicasets", "daemonsets"]
  verbs: ["watch", "list", "get"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["watch", "list"]
- apiGroups: ["apps"]
  resources: ["statefulsets", "replicasets", "daemonsets"]
  verbs: ["watch", "list", "get"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
  verbs: ["watch", "list", "get"]
- apiGroups: ["batch", "extensions"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create"]
- apiGroups: ["coordination.k8s.io"]
  resourceNames: ["cluster-autoscaler"]
  resources: ["leases"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create","list","watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["cluster-autoscaler-status", "cluster-autoscaler-priority-expander"]
  verbs: ["delete", "get", "update", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
  name: cluster-autoscaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
- kind: ServiceAccount
  name: cluster-autoscaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler
subjects:
- kind: ServiceAccount
  name: cluster-autoscaler
  namespace: kube-system
---
# Priority Class for Critical Workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: activelog-critical
value: 1000000
globalDefault: false
description: "Priority class for critical ActiveLog services"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: activelog-high
value: 100000
globalDefault: false
description: "Priority class for high-priority ActiveLog services"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: activelog-normal
value: 10000
globalDefault: true
description: "Priority class for normal ActiveLog services"
---
# Node Pool Configuration (example for AWS EKS)
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-pool-config
  namespace: activelog-system
data:
  node-pools.yaml: |
    # Node pool definitions for different workload types
    
    # General purpose node pool
    general:
      instance_type: "m5.large"
      min_size: 3
      max_size: 20
      desired_size: 5
      labels:
        workload-type: general
        node-pool: general
      taints: []
    
    # Compute-intensive node pool for AI/ML workloads
    compute:
      instance_type: "c5.2xlarge"
      min_size: 0
      max_size: 10
      desired_size: 2
      labels:
        workload-type: compute
        node-pool: compute
      taints:
      - key: workload-type
        value: compute
        effect: NoSchedule
    
    # Memory-intensive node pool for data processing
    memory:
      instance_type: "r5.xlarge"
      min_size: 0
      max_size: 8
      desired_size: 1
      labels:
        workload-type: memory
        node-pool: memory
      taints:
      - key: workload-type
        value: memory
        effect: NoSchedule
    
    # GPU node pool for ML training
    gpu:
      instance_type: "g4dn.xlarge"
      min_size: 0
      max_size: 5
      desired_size: 0
      labels:
        workload-type: gpu
        node-pool: gpu
        nvidia.com/gpu: "true"
      taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
    
    # Spot instance node pool for cost optimization
    spot:
      instance_type: "m5.large"
      min_size: 0
      max_size: 15
      desired_size: 0
      spot_price: "0.08"
      labels:
        workload-type: spot
        node-pool: spot
        lifecycle: spot
      taints:
      - key: lifecycle
        value: spot
        effect: NoSchedule
---
# Resource Quotas per Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: activelog-quota
  namespace: activelog
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    limits.cpu: "200"
    limits.memory: 400Gi
    pods: "200"
    services: "100"
    persistentvolumeclaims: "50"
---
# Limit Ranges for Resource Management
apiVersion: v1
kind: LimitRange
metadata:
  name: activelog-limits
  namespace: activelog
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container
  - max:
      cpu: 8
      memory: 32Gi
    min:
      cpu: 10m
      memory: 64Mi
    type: Container
  - max:
      storage: 100Gi
    type: PersistentVolumeClaim