    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization,Content-Type,X-Game-Session"
spec:
  tls:
  - hosts:
    - game.activelog.com
    secretName: activelog-tls
  rules:
  - host: game.activelog.com
    http:
      paths:
      - path: /platform/
        pathType: Prefix
        backend:
          service:
            name: gaming-platform
            port:
              number: 8070
      - path: /dmlog/
        pathType: Prefix
        backend:
          service:
            name: dmlog-core
            port:
              number: 8071
      - path: /characters/
        pathType: Prefix
        backend:
          service:
            name: dmlog-characters
            port:
              number: 8072
      - path: /battle/
        pathType: Prefix
        backend:
          service:
            name: dmlog-battle
            port:
              number: 8073
      - path: /session/
        pathType: Prefix
