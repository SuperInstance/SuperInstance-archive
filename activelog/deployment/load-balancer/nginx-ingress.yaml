# Gaming Platform Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: activelog-gaming-ingress
  namespace: activelog
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "gaming-platform"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"  # 1 hour for long gaming sessions
    
    # Gaming-specific CORS
