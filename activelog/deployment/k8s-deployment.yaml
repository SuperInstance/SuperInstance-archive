apiVersion: apps/v1
kind: Deployment
metadata:
  name: activelog-cloud
spec:
  replicas: 3
  selector:
    matchLabels:
      app: activelog-cloud
  template:
    metadata:
      labels:
        app: activelog-cloud
    spec:
      containers:
      - name: activelog
        image: activelog/cloud:latest
        ports:
        - containerPort: 8000
        env:
        - name: CLOUD_MODE
          value: "true"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: activelog-service
spec:
  selector:
    app: activelog-cloud
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
