<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMLog Mobile - RPG Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(90deg, #4CAF50, #45a049);
            padding: 20px 15px 15px 15px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .connection-status {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        .connection-status.offline {
            background: #f44336;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-tab {
            flex: 1;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            border: none;
            background: none;
            color: rgba(255, 255, 255, 0.7);
        }

        .nav-tab.active {
            background: rgba(76, 175, 80, 0.3);
            color: white;
            border-bottom: 3px solid #4CAF50;
        }

        .nav-tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-content {
            display: none;
            padding: 20px;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .dice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .dice-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .dice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .dice-btn:active {
            transform: scale(0.95);
        }

        .dice-result {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #4CAF50;
            margin: 20px 0;
            animation: rollIn 0.5s ease;
        }

        @keyframes rollIn {
            from { transform: rotate(-360deg) scale(0); }
            to { transform: rotate(0deg) scale(1); }
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #ddd;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #757575 0%, #616161 100%);
            box-shadow: 0 4px 15px rgba(117, 117, 117, 0.4);
        }

        .initiative-list {
            list-style: none;
        }

        .initiative-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4CAF50;
        }

        .initiative-item.current {
            background: rgba(76, 175, 80, 0.3);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }

        .character-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-block {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-name {
            font-size: 12px;
            color: #ddd;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }

        .stat-modifier {
            font-size: 12px;
            color: #aaa;
        }

        .spell-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .spell-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .spell-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .spell-name {
            font-weight: bold;
            color: #4CAF50;
        }

        .spell-details {
            font-size: 14px;
            color: #ddd;
            margin-top: 5px;
        }

        .notes-area {
            min-height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            color: white;
            font-family: monospace;
            resize: vertical;
        }

        .sync-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quick-actions .btn {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }

        .offline-indicator {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .offline-indicator.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🎲 DMLog Mobile</h1>
            <p>RPG Companion</p>
            <div class="connection-status" id="connectionStatus"></div>
        </div>

        <div class="offline-indicator" id="offlineIndicator">
            📶 Offline Mode - Changes will sync when connected
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('dice')">
                🎲<br>Dice
            </button>
            <button class="nav-tab" onclick="showTab('character')">
                👤<br>Character
            </button>
            <button class="nav-tab" onclick="showTab('initiative')">
                ⚔️<br>Combat
            </button>
            <button class="nav-tab" onclick="showTab('spells')">
                ✨<br>Spells
            </button>
            <button class="nav-tab" onclick="showTab('notes')">
                📝<br>Notes
            </button>
        </div>

        <!-- Dice Roller Tab -->
        <div class="tab-content active" id="dice">
            <div class="card">
                <h3>Quick Roll</h3>
                <div class="dice-grid">
                    <button class="dice-btn" onclick="rollDice(4)">d4</button>
                    <button class="dice-btn" onclick="rollDice(6)">d6</button>
                    <button class="dice-btn" onclick="rollDice(8)">d8</button>
                    <button class="dice-btn" onclick="rollDice(10)">d10</button>
                    <button class="dice-btn" onclick="rollDice(12)">d12</button>
                    <button class="dice-btn" onclick="rollDice(20)">d20</button>
                </div>
                
                <div class="input-group">
                    <label>Custom Roll</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="customDice" placeholder="Dice count" value="1" min="1" max="10" style="flex: 1;">
                        <select id="customSides" style="flex: 1;">
                            <option value="4">d4</option>
                            <option value="6">d6</option>
                            <option value="8">d8</option>
                            <option value="10">d10</option>
                            <option value="12">d12</option>
                            <option value="20" selected>d20</option>
                            <option value="100">d100</option>
                        </select>
                        <input type="number" id="modifier" placeholder="Mod" value="0" style="flex: 1;">
                    </div>
                </div>
                <button class="btn" onclick="rollCustomDice()">Roll Custom</button>
            </div>

            <div class="card">
                <div class="dice-result" id="diceResult">Roll some dice!</div>
                <div id="rollHistory" style="max-height: 200px; overflow-y: auto; font-size: 14px; color: #ddd;"></div>
            </div>
        </div>

        <!-- Character Sheet Tab -->
        <div class="tab-content" id="character">
            <div class="card">
                <div class="input-group">
                    <label>Character Name</label>
                    <input type="text" id="characterName" placeholder="Enter character name" onchange="saveCharacter()">
                </div>
                
                <div class="input-group">
                    <label>Class & Level</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="characterClass" onchange="saveCharacter()" style="flex: 2;">
                            <option value="">Select Class</option>
                            <option value="Barbarian">Barbarian</option>
                            <option value="Bard">Bard</option>
                            <option value="Cleric">Cleric</option>
                            <option value="Druid">Druid</option>
                            <option value="Fighter">Fighter</option>
                            <option value="Monk">Monk</option>
                            <option value="Paladin">Paladin</option>
                            <option value="Ranger">Ranger</option>
                            <option value="Rogue">Rogue</option>
                            <option value="Sorcerer">Sorcerer</option>
                            <option value="Warlock">Warlock</option>
                            <option value="Wizard">Wizard</option>
                        </select>
                        <input type="number" id="characterLevel" placeholder="Lvl" min="1" max="20" value="1" onchange="saveCharacter()" style="flex: 1;">
                    </div>
                </div>
                
                <h4>Ability Scores</h4>
                <div class="character-stats">
                    <div class="stat-block">
                        <div class="stat-name">STR</div>
                        <div class="stat-value" id="strValue">10</div>
                        <div class="stat-modifier" id="strMod">+0</div>
                        <input type="number" id="strScore" value="10" min="1" max="30" onchange="updateStat('str')" style="width: 50px; margin-top: 5px;">
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">DEX</div>
                        <div class="stat-value" id="dexValue">10</div>
                        <div class="stat-modifier" id="dexMod">+0</div>
                        <input type="number" id="dexScore" value="10" min="1" max="30" onchange="updateStat('dex')" style="width: 50px; margin-top: 5px;">
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">CON</div>
                        <div class="stat-value" id="conValue">10</div>
                        <div class="stat-modifier" id="conMod">+0</div>
                        <input type="number" id="conScore" value="10" min="1" max="30" onchange="updateStat('con')" style="width: 50px; margin-top: 5px;">
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">INT</div>
                        <div class="stat-value" id="intValue">10</div>
                        <div class="stat-modifier" id="intMod">+0</div>
                        <input type="number" id="intScore" value="10" min="1" max="30" onchange="updateStat('int')" style="width: 50px; margin-top: 5px;">
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">WIS</div>
                        <div class="stat-value" id="wisValue">10</div>
                        <div class="stat-modifier" id="wisMod">+0</div>
                        <input type="number" id="wisScore" value="10" min="1" max="30" onchange="updateStat('wis')" style="width: 50px; margin-top: 5px;">
                    </div>
                    <div class="stat-block">
                        <div class="stat-name">CHA</div>
                        <div class="stat-value" id="chaValue">10</div>
                        <div class="stat-modifier" id="chaMod">+0</div>
                        <input type="number" id="chaScore" value="10" min="1" max="30" onchange="updateStat('cha')" style="width: 50px; margin-top: 5px;">
                    </div>
                </div>

                <div class="quick-actions">
                    <button class="btn btn-secondary" onclick="rollStats()">Roll 4d6</button>
                    <button class="btn" onclick="syncCharacter()">
                        Sync <span class="sync-indicator" id="syncIndicator" style="display: none;"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Initiative/Combat Tab -->
        <div class="tab-content" id="initiative">
            <div class="card">
                <h3>Initiative Tracker</h3>
                <div class="input-group">
                    <label>Add Combatant</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="combatantName" placeholder="Name" style="flex: 2;">
                        <input type="number" id="combatantInit" placeholder="Init" min="1" max="30" style="flex: 1;">
                    </div>
                </div>
                <div class="quick-actions">
                    <button class="btn" onclick="addCombatant()">Add</button>
                    <button class="btn btn-secondary" onclick="nextTurn()">Next Turn</button>
                    <button class="btn btn-secondary" onclick="clearCombat()">Clear</button>
                </div>
            </div>

            <div class="card">
                <h4>Initiative Order (Round <span id="roundCounter">1</span>)</h4>
                <ul class="initiative-list" id="initiativeList">
                    <li style="text-align: center; color: #888; padding: 20px;">No combatants added</li>
                </ul>
            </div>
        </div>

        <!-- Spells/Abilities Tab -->
        <div class="tab-content" id="spells">
            <div class="card">
                <h3>Quick Reference</h3>
                <div class="input-group">
                    <input type="text" id="spellSearch" placeholder="Search spells and abilities..." onkeyup="filterSpells()">
                </div>
                <div class="spell-list" id="spellList">
                    <!-- Spells will be populated here -->
                </div>
            </div>
        </div>

        <!-- Notes Tab -->
        <div class="tab-content" id="notes">
            <div class="card">
                <h3>Session Notes</h3>
                <textarea class="notes-area" id="notesArea" placeholder="Take notes during your session..."></textarea>
                <div class="quick-actions" style="margin-top: 15px;">
                    <button class="btn" onclick="saveNotes()">Save Notes</button>
                    <button class="btn btn-secondary" onclick="exportNotes()">Export</button>
                </div>
            </div>
        </div>
    </div>

    <script src="dmlog-mobile.js"></script>
</body>
</html>
