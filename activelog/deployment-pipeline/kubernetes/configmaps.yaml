apiVersion: v1
kind: ConfigMap
metadata:
  name: dmlog-config
  namespace: dmlog-staging
data:
  NODE_ENV: "staging"
  LOG_LEVEL: "info"
  API_BASE_URL: "https://api-staging.dmlog.com"
  FRONTEND_URL: "https://staging.dmlog.com"
  CORS_ORIGIN: "https://staging.dmlog.com"
  SESSION_TIMEOUT: "3600"
  RATE_LIMIT: "100"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dmlog-config
  namespace: dmlog-production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "warn"
  API_BASE_URL: "https://api.dmlog.com"
  FRONTEND_URL: "https://dmlog.com"
  CORS_ORIGIN: "https://dmlog.com"
  SESSION_TIMEOUT: "7200"
  RATE_LIMIT: "1000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dmlog-staging
data:
  nginx.conf: |
    upstream backend {
        server dmlog-integration:8203;
    }
    upstream orchestrator {
        server data-orchestrator:8204;
    }
    server {
        listen 80;
        server_name staging.dmlog.com;
        
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /orchestrator/ {
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location / {
            proxy_pass http://frontend-dmlog-final:80;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dmlog-production
data:
  nginx.conf: |
    upstream backend {
        server dmlog-integration:8203;
    }
    upstream orchestrator {
        server data-orchestrator:8204;
    }
    server {
        listen 80;
        server_name dmlog.com;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /orchestrator/ {
            proxy_pass http://orchestrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location / {
            proxy_pass http://frontend-dmlog-final:80;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: dmlog-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: 'dmlog-services'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['dmlog-staging', 'dmlog-production']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true