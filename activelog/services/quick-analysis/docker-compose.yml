version: '3.8'

services:
  quick-analysis:
    build: .
    container_name: quick-analysis-portal
    ports:
      - "8420:8420"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=sqlite:///data/quick_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - PORT=8420
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - quick-analysis-network

  redis:
    image: redis:7-alpine
    container_name: quick-analysis-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - quick-analysis-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: quick-analysis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - quick-analysis
    networks:
      - quick-analysis-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  quick-analysis-network:
    driver: bridge