<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Analysis Portal</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .header {
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0 0 5px 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .header p {
            margin: 0;
            font-size: 12px;
            opacity: 0.8;
        }
        
        .content {
            padding: 0 20px 20px;
        }
        
        .search-container {
            margin-bottom: 15px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        
        .search-btn {
            width: 100%;
            padding: 12px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        .search-btn:hover {
            background: #1d4ed8;
        }
        
        .quick-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .quick-btn {
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .actions {
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
        }
        
        .action-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .action-btn:hover {
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 11px;
            opacity: 0.7;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        
        .stock-price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .price-change {
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Quick Analysis</h1>
        <p>Instant stock analysis</p>
    </div>
    
    <div class="content">
        <div class="search-container">
            <input type="text" 
                   id="symbolInput" 
                   class="search-input" 
                   placeholder="Enter stock symbol (e.g., AAPL)"
                   autocomplete="off">
            <button onclick="analyzeStock()" class="search-btn">Analyze Stock</button>
        </div>
        
        <div class="quick-buttons">
            <button onclick="quickAnalyze('AAPL')" class="quick-btn">AAPL</button>
            <button onclick="quickAnalyze('TSLA')" class="quick-btn">TSLA</button>
            <button onclick="quickAnalyze('MSFT')" class="quick-btn">MSFT</button>
            <button onclick="quickAnalyze('GOOGL')" class="quick-btn">GOOGL</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing...</p>
        </div>
        
        <div class="results" id="results">
            <div id="resultsContent"></div>
            <button onclick="openFullAnalysis()" class="search-btn" style="margin-top: 10px;">
                View Full Analysis →
            </button>
        </div>
        
        <div class="actions">
            <button onclick="openPortal()" class="action-btn">
                🌐 Open Full Portal
            </button>
            <button onclick="showKeyboardShortcuts()" class="action-btn">
                ⌨️ Keyboard Shortcuts
            </button>
            <button onclick="openSettings()" class="action-btn">
                ⚙️ Extension Settings
            </button>
        </div>
    </div>
    
    <div class="footer">
        Right-click any stock symbol for instant analysis
    </div>

    <script>
        let currentSymbol = '';
        
        // Focus search input on load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('symbolInput').focus();
        });
        
        // Handle Enter key in search input
        document.getElementById('symbolInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                analyzeStock();
            }
        });
        
        function quickAnalyze(symbol) {
            document.getElementById('symbolInput').value = symbol;
            analyzeStock();
        }
        
        async function analyzeStock() {
            const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
            if (!symbol) return;
            
            currentSymbol = symbol;
            showLoading(true);
            
            try {
                const response = await fetch('https://analysis.activeledger.ai/api/quick-analysis', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ symbol: symbol })
                });
                
                const data = await response.json();
                showLoading(false);
                
                if (data.error) {
                    showError(data.error);
                } else {
                    showResults(data);
                }
                
            } catch (error) {
                showLoading(false);
                showError('Failed to fetch analysis data');
            }
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('results').style.display = 'none';
        }
        
        function showResults(data) {
            const quote = data.quote;
            const changeClass = quote.change >= 0 ? 'positive' : 'negative';
            const changeSymbol = quote.change >= 0 ? '+' : '';
            
            const html = `
                <div style="text-align: center;">
                    <h3 style="margin: 0 0 10px 0; font-size: 16px;">${quote.symbol}</h3>
                    <div class="stock-price">$${quote.current_price}</div>
                    <div class="price-change ${changeClass}">
                        ${changeSymbol}${quote.change} (${changeSymbol}${quote.change_percent.toFixed(2)}%)
                    </div>
                </div>
                <div style="font-size: 12px; margin-top: 15px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span>Volume:</span>
                        <span>${quote.volume ? quote.volume.toLocaleString() : 'N/A'}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span>P/E:</span>
                        <span>${quote.pe_ratio || 'N/A'}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>Mkt Cap:</span>
                        <span>${quote.market_cap ? '$' + (quote.market_cap/1e9).toFixed(1) + 'B' : 'N/A'}</span>
                    </div>
                </div>
            `;
            
            document.getElementById('resultsContent').innerHTML = html;
            document.getElementById('results').style.display = 'block';
        }
        
        function showError(error) {
            const html = `
                <div style="text-align: center; color: #ef4444;">
                    <h3 style="margin: 0 0 10px 0; font-size: 16px;">❌ Error</h3>
                    <p style="margin: 0; font-size: 13px;">${error}</p>
                </div>
            `;
            
            document.getElementById('resultsContent').innerHTML = html;
            document.getElementById('results').style.display = 'block';
        }
        
        function openPortal() {
            chrome.tabs.create({
                url: 'https://analysis.activeledger.ai'
            });
            window.close();
        }
        
        function openFullAnalysis() {
            if (currentSymbol) {
                chrome.tabs.create({
                    url: `https://analysis.activeledger.ai?symbol=${currentSymbol}`
                });
                window.close();
            }
        }
        
        function showKeyboardShortcuts() {
            alert('Keyboard Shortcuts:\n\n' +
                  'Ctrl+Shift+A - Open Quick Analysis\n' +
                  'Ctrl+Shift+S - Quick Search\n' +
                  'Right-click any stock symbol - Instant analysis');
        }
        
        function openSettings() {
            chrome.runtime.openOptionsPage();
        }
        
        // Check if user has selected text on the current page
        chrome.tabs.query({active: true, currentWindow: true}, (tabs) => {
            chrome.tabs.sendMessage(tabs[0].id, {action: 'getSelection'}, (response) => {
                if (response && response.selection) {
                    const selection = response.selection.trim().toUpperCase();
                    if (/^[A-Z]{1,5}$/.test(selection)) {
                        document.getElementById('symbolInput').value = selection;
                        document.getElementById('symbolInput').select();
                    }
                }
            });
        });
    </script>
</body>
</html>
