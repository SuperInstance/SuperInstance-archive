version: '3.8'

services:
  file-watcher:
    build: .
    ports:
      - "8005:8005"
    environment:
      - WATCH_DIRECTORIES=/watched/documents,/watched/downloads
      - WATCH_RECURSIVE=true
      - WATCH_HIDDEN_FILES=false
      - INCLUDE_PATTERNS=*.txt,*.pdf,*.jpg,*.png,*.docx,*.xlsx,*.py,*.js,*.md
      - EXCLUDE_PATTERNS=*.tmp,*.swp,*~,.DS_Store,Thumbs.db
      - BATCH_SIZE=100
      - BATCH_TIMEOUT=5
      - DEBOUNCE_DELAY=1
      - MAX_EVENTS_PER_SECOND=1000
      - NATS_URL=nats://nats:4222
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=4
      - SYNC_ENGINE_URL=http://sync-engine:8004
      - ENABLE_METRICS=true
      - LOG_LEVEL=INFO
    volumes:
      - /tmp/activelog-test:/watched/documents
      - /tmp/activelog-downloads:/watched/downloads
    depends_on:
      - redis
      - nats
    networks:
      - activelog

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - activelog

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    command: [
      "--jetstream",
      "--store_dir=/data",
      "--max_memory_store=1GB",
      "--max_file_store=10GB"
    ]
    volumes:
      - nats_data:/data
    networks:
      - activelog

volumes:
  redis_data:
  nats_data:

networks:
  activelog:
    external: true