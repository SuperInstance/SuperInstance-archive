[pytest]
# ActiveLog Beta Integration Test Configuration

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test categories
markers =
    integration: Integration tests across services
    e2e: End-to-end user journey tests
    load: Load and performance tests
    security: Security and authentication tests
    accessibility: Accessibility compliance tests
    performance: Performance benchmarking tests
    slow: Slow-running tests (>30 seconds)
    external: Tests requiring external services
    beta: Beta integration tests
    cross_app: Cross-application workflow tests
    real_time: Real-time feature tests

# Test discovery patterns
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --durations=20
    --maxfail=5
    --disable-warnings
    --color=yes
    -p no:cacheprovider

# Timeout settings
timeout = 300
timeout_method = thread

# Parallel execution
junit_family = xunit2
junit_duration_report = total

# Coverage settings
# Uncomment to enable coverage reporting
# addopts = --cov=activelog --cov-report=html --cov-report=term

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:requests.*
    ignore::UserWarning:urllib3.*

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s() %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Minimum pytest version
minversion = 7.0

# Test collection timeout
collect_ignore = []

# Custom test ordering
# Run quick tests first, then integration, then e2e, finally load tests