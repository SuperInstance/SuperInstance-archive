[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=activelog
    --cov=services
    --cov-report=term-missing:skip-covered
    --cov-report=html:tests/coverage/html
    --cov-report=xml:tests/coverage/coverage.xml
    --cov-report=json:tests/coverage/coverage.json
    --cov-branch
    --cov-fail-under=80
    --tb=short
    --durations=10
    --maxfail=5
    --capture=no
    -v
testpaths = 
    tests/unit
    tests/integration
    tests/e2e
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    .venv
    venv
    node_modules
    coverage
markers =
    unit: Unit tests - fast isolated tests
    integration: Integration tests - test component interactions
    e2e: End-to-end tests - full workflow tests via browser
    load: Load tests - performance and stress testing
    slow: Slow running tests (>5 seconds)
    fast: Fast running tests (<1 second)
    auth: Authentication and authorization tests
    database: Database related tests
    cache: Cache and Redis related tests
    api: API endpoint tests
    ai: AI and machine learning tests
    search: Search and indexing tests
    file: File operations tests
    security: Security and validation tests
    performance: Performance benchmarking tests
    smoke: Smoke tests for basic functionality
    regression: Regression tests for bug fixes
    external: Tests requiring external services
    mock: Tests using mock objects
    fixture: Tests focused on fixtures and test data
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::UserWarning:markdown.*
    ignore::ResourceWarning