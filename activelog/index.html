<!DOCTYPE html>
<html>
<head>
    <title>PersonalLog Beta</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; }
        .container { background: #f0f0f0; padding: 30px; border-radius: 10px; }
        textarea { width: 100%; padding: 10px; font-size: 16px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .record-btn { background: #dc3545; }
        .stop-btn { background: #28a745; }
        .recording-indicator { color: #dc3545; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .controls { margin: 10px 0; }
        .entry { background: white; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .audio-player { margin: 5px 0; }
        .timer { font-size: 14px; color: #666; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PersonalLog Beta</h1>
        <textarea id="entryText" rows="4" placeholder="Write your thoughts..."></textarea>
        <div class="controls">
            <button onclick="saveEntry()">Save Entry</button>
            <button id="recordBtn" class="record-btn" onclick="startRecording()">🎤 Record</button>
            <button id="stopBtn" class="stop-btn" onclick="stopRecording()" style="display: none;">⏹️ Stop</button>
            <span id="recordingIndicator" class="recording-indicator" style="display: none;">● Recording...</span>
            <span id="recordingTimer" class="timer" style="display: none;">0:00</span>
        </div>
        <div id="entries"></div>
    </div>
    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recordingTimer;
        let recordingStartTime;
        let currentAudio = null;
        
        async function saveEntry() {
            const text = document.getElementById('entryText').value;
            const payload = {text: text};
            
            if (currentAudio) {
                payload.audio = currentAudio;
            }
            
            await fetch('http://localhost:8000/api/entry', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            document.getElementById('entryText').value = '';
            currentAudio = null;
            loadEntries();
        }
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                recordingStartTime = Date.now();
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    currentAudio = await convertBlobToBase64(audioBlob);
                    
                    // Add audio entry notation to text area
                    const currentText = document.getElementById('entryText').value;
                    const audioEntry = currentText ? `${currentText}\n[Voice Recording attached]` : '[Voice Recording attached]';
                    document.getElementById('entryText').value = audioEntry;
                    
                    // Stop all tracks to release microphone
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                
                // Start timer
                updateRecordingTimer();
                recordingTimer = setInterval(updateRecordingTimer, 1000);
                
                // Auto-stop after 60 seconds
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        stopRecording();
                    }
                }, 60000);
                
                // Update UI
                document.getElementById('recordBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'inline-block';
                document.getElementById('recordingIndicator').style.display = 'inline';
                document.getElementById('recordingTimer').style.display = 'inline';
                
            } catch (error) {
                alert('Error accessing microphone: ' + error.message);
            }
        }
        
        function updateRecordingTimer() {
            if (recordingStartTime) {
                const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('recordingTimer').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            
            // Clear timer
            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }
            recordingStartTime = null;
            
            // Update UI
            document.getElementById('recordBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('recordingIndicator').style.display = 'none';
            document.getElementById('recordingTimer').style.display = 'none';
            document.getElementById('recordingTimer').textContent = '0:00';
        }
        
        function convertBlobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
        
        async function loadEntries() {
            const response = await fetch('http://localhost:8000/api/entries');
            const entries = await response.json();
            document.getElementById('entries').innerHTML = entries.reverse().map(e => {
                let entryHTML = '<div class="entry">' + e.text;
                if (e.audio) {
                    entryHTML += '<div class="audio-player"><audio controls><source src="' + e.audio + '" type="audio/wav">Your browser does not support audio playback.</audio></div>';
                }
                entryHTML += '<br><small>' + e.timestamp + '</small></div>';
                return entryHTML;
            }).join('');
        }
        loadEntries();
    </script>
</body>
</html>
