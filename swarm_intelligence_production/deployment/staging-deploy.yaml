name: Staging Deployment

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - develop
      - staging
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  NAMESPACE: swarm-intelligence
  ENVIRONMENT: staging
  AWS_REGION: us-east-1
  CLUSTER_NAME: swarm-staging-eks

jobs:
  # Job 1: Run all tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Go dependencies
        run: |
          cd backend/core
          go mod download
          go mod verify

      - name: Run Go unit tests
        run: |
          cd backend/core
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Install Python dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run API tests
        run: |
          cd api
          pytest tests/ -v --cov=. --cov-report=html

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:ci

      - name: Run linting
        run: |
          cd backend/core && go vet ./...
          cd ../../api && pylint *.py || true
          cd ../frontend && npm run lint

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/core/coverage.out,./api/htmlcov/index.html
          flags: unittests
          name: codecov-umbrella

  # Job 2: Build and push Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event.inputs.skip_tests != 'true'
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    outputs:
      core_image: ${{ steps.meta-core.outputs.tags }}
      api_image: ${{ steps.meta-api.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Core
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/swarm-core
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=staging-latest

      - name: Build and push Core image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.core
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/swarm-core:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/swarm-core:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=staging-${{ github.sha }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/swarm-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=staging-latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/swarm-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/swarm-api:buildcache,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/swarm-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=staging-latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/swarm-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/swarm-frontend:buildcache,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/swarm-core:staging-latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 3: Deploy to staging Kubernetes
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.swarm-intelligence.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace if needed
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in manifests
        run: |
          # Update core deployment
          kubectl set image deployment/swarm-core \
            swarm-core=${{ env.REGISTRY }}/${{ github.repository }}/swarm-core:staging-latest \
            -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Update API deployment
          kubectl set image deployment/swarm-api \
            swarm-api=${{ env.REGISTRY }}/${{ github.repository }}/swarm-api:staging-latest \
            -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Update frontend deployment
          kubectl set image deployment/swarm-frontend \
            swarm-frontend=${{ env.REGISTRY }}/${{ github.repository }}/swarm-frontend:staging-latest \
            -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy using deployment script
        run: |
          chmod +x deployment/deploy.sh
          ./deployment/deploy.sh -e staging -c aws -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/swarm-core -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/swarm-api -n ${{ env.NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/swarm-frontend -n ${{ env.NAMESPACE }} --timeout=10m

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }}

          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}

          echo "=== Ingress ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}

  # Job 4: Run smoke tests
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install requests pytest

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          sleep 60

      - name: Run smoke tests
        env:
          STAGING_API_URL: https://staging-api.swarm-intelligence.example.com
          STAGING_FRONTEND_URL: https://staging.swarm-intelligence.example.com
        run: |
          python tests/e2e/smoke_test.py

      - name: Test API health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.swarm-intelligence.example.com/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "API health check passed"

      - name: Test WebSocket connection
        run: |
          # Test WebSocket endpoint is accessible
          curl -s https://staging-api.swarm-intelligence.example.com/ws | grep -q "upgrade" || echo "WebSocket endpoint ready"

      - name: Test agent creation
        run: |
          response=$(curl -X POST https://staging-api.swarm-intelligence.example.com/api/swarms \
            -H "Content-Type: application/json" \
            -d '{"name":"smoke-test-swarm","agent_count":100}' \
            -s -w "%{http_code}")

          if [[ "$response" != *"20"* ]]; then
            echo "Failed to create swarm"
            exit 1
          fi
          echo "Swarm creation test passed"

      - name: Performance benchmark
        run: |
          python tests/e2e/performance_benchmark.py --target staging --agents 10000 --duration 60

  # Job 5: Notify team
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always()

    steps:
      - name: Send Slack notification - Success
        if: needs.smoke-test.result == 'success'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ Staging Deployment Successful",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Staging Deployment Successful"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nStaging"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*URL:*\nhttps://staging.swarm-intelligence.example.com"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "All smoke tests passed. Ready for testing."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send Slack notification - Failure
        if: needs.smoke-test.result == 'failure' || needs.deploy.result == 'failure'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Staging Deployment Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Staging Deployment Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nStaging"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Logs:*\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ Deployment or smoke tests failed. Please investigate."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Create GitHub deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: '${{ needs.smoke-test.result }}' === 'success' ? 'success' : 'failure',
              environment_url: 'https://staging.swarm-intelligence.example.com'
            });
