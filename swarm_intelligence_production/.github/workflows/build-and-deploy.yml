name: Build and Deploy Swarm Intelligence Platform

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21']
        node-version: ['20']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Go dependencies
        run: go mod download

      - name: Run Go tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Run Go benchmarks
        run: go test -bench=. -benchmem ./...

      - name: Install Node dependencies
        working-directory: ./api
        run: npm ci

      - name: Run API tests
        working-directory: ./api
        run: npm test

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm ci
          npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'

  build-and-push:
    name: Build and Push Docker Images
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component:
          - name: core
            dockerfile: infrastructure/docker/Dockerfile.core
            context: .
          - name: api
            dockerfile: infrastructure/docker/Dockerfile.api
            context: .
          - name: frontend
            dockerfile: infrastructure/docker/Dockerfile.frontend
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/swarm-${{ matrix.component.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/swarm-${{ matrix.component.name }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.swarm.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name swarm-intelligence-staging --region us-east-1

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/swarm-core \
            swarm-core=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/swarm-core:${{ github.sha }} \
            -n swarm-intelligence

          kubectl set image deployment/swarm-api \
            swarm-api=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/swarm-api:${{ github.sha }} \
            -n swarm-intelligence

          kubectl set image deployment/swarm-frontend \
            nginx=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/swarm-frontend:${{ github.sha }} \
            -n swarm-intelligence

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/swarm-core -n swarm-intelligence --timeout=10m
          kubectl rollout status deployment/swarm-api -n swarm-intelligence --timeout=10m
          kubectl rollout status deployment/swarm-frontend -n swarm-intelligence --timeout=5m

      - name: Run smoke tests
        run: |
          chmod +x ./tests/smoke-tests.sh
          ./tests/smoke-tests.sh https://staging.swarm.example.com

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://swarm.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name swarm-intelligence-prod --region us-east-1

      - name: Create backup
        run: |
          kubectl create job --from=cronjob/backup backup-pre-deploy-${{ github.sha }} -n swarm-intelligence
          kubectl wait --for=condition=complete --timeout=10m job/backup-pre-deploy-${{ github.sha }} -n swarm-intelligence

      - name: Blue-Green Deployment - Deploy Green
        run: |
          # Create green deployment
          kubectl apply -f infrastructure/kubernetes/core-deployment-green.yaml
          kubectl apply -f infrastructure/kubernetes/api-deployment-green.yaml

          # Wait for green to be ready
          kubectl rollout status deployment/swarm-core-green -n swarm-intelligence --timeout=10m
          kubectl rollout status deployment/swarm-api-green -n swarm-intelligence --timeout=10m

      - name: Run integration tests on green
        run: |
          chmod +x ./tests/integration-tests.sh
          ./tests/integration-tests.sh swarm-core-green.swarm-intelligence.svc.cluster.local

      - name: Switch traffic to green
        run: |
          # Update service to point to green
          kubectl patch service swarm-core -n swarm-intelligence -p '{"spec":{"selector":{"version":"green"}}}'
          kubectl patch service swarm-api -n swarm-intelligence -p '{"spec":{"selector":{"version":"green"}}}'

      - name: Monitor for 5 minutes
        run: |
          sleep 300
          # Check error rates
          ERROR_RATE=$(kubectl exec -n swarm-intelligence prometheus-0 -- \
            promtool query instant 'rate(http_requests_total{status=~"5.."}[5m])' | grep -oP '\d+\.\d+')

          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "High error rate detected: $ERROR_RATE"
            exit 1
          fi

      - name: Delete blue deployment
        run: |
          kubectl delete deployment swarm-core-blue -n swarm-intelligence || true
          kubectl delete deployment swarm-api-blue -n swarm-intelligence || true

      - name: Update frontend
        run: |
          kubectl set image deployment/swarm-frontend \
            nginx=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/swarm-frontend:${{ github.sha }} \
            -n swarm-intelligence
          kubectl rollout status deployment/swarm-frontend -n swarm-intelligence --timeout=5m

      - name: Send deployment notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment completed successfully!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()

  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: deploy-production
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name swarm-intelligence-prod --region us-east-1

      - name: Rollback deployments
        run: |
          kubectl rollout undo deployment/swarm-core -n swarm-intelligence
          kubectl rollout undo deployment/swarm-api -n swarm-intelligence
          kubectl rollout undo deployment/swarm-frontend -n swarm-intelligence

          kubectl rollout status deployment/swarm-core -n swarm-intelligence --timeout=5m
          kubectl rollout status deployment/swarm-api -n swarm-intelligence --timeout=5m
          kubectl rollout status deployment/swarm-frontend -n swarm-intelligence --timeout=3m

      - name: Restore from backup
        run: |
          kubectl create job --from=cronjob/restore restore-${{ github.sha }} -n swarm-intelligence
          kubectl wait --for=condition=complete --timeout=10m job/restore-${{ github.sha }} -n swarm-intelligence

      - name: Send rollback notification
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          text: 'Production deployment rolled back due to failure'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
