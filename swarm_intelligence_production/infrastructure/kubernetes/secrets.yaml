apiVersion: v1
kind: Secret
metadata:
  name: swarm-secrets
  namespace: swarm-intelligence
type: Opaque
stringData:
  # Database Credentials
  postgres.user: "swarm_user"
  postgres.password: "CHANGE_ME_IN_PRODUCTION"

  # Redis Password
  redis.password: ""

  # JWT Secret
  jwt.secret: "CHANGE_ME_GENERATE_SECURE_RANDOM_SECRET"

  # API Keys
  api.key: "CHANGE_ME_GENERATE_API_KEY"

  # S3/MinIO Credentials for Pheromone Storage
  s3.access.key: "CHANGE_ME"
  s3.secret.key: "CHANGE_ME"
