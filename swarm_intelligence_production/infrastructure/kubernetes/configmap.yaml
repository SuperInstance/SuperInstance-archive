apiVersion: v1
kind: ConfigMap
metadata:
  name: swarm-config
  namespace: swarm-intelligence
data:
  # Application Configuration
  app.env: "production"
  log.level: "info"
  max.agents: "10000000"
  worker.threads: "32"

  # Database Configuration
  postgres.host: "postgres-service"
  postgres.port: "5432"
  postgres.db: "swarm_intelligence"
  postgres.max.connections: "100"

  # Redis Configuration
  redis.host: "redis-service"
  redis.port: "6379"
  redis.max.connections: "1000"

  # Kafka Configuration
  kafka.brokers: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092"
  kafka.topic.prefix: "swarm"
  kafka.consumer.group: "swarm-orchestrator"
  kafka.partitions: "100"

  # Coordination Configuration
  file.lock.timeout: "30"
  voting.threshold: "0.7"
  voting.quorum: "0.5"
  voting.timeout: "30"

  # Performance Configuration
  spatial.index.levels: "4"
  neighbor.cache.ttl: "60"
  pheromone.decay.rate: "0.01"
  work.stealing.enabled: "true"

  # Monitoring Configuration
  prometheus.port: "9090"
  metrics.interval: "15"
  tracing.enabled: "true"
  jaeger.endpoint: "http://jaeger-collector:14268/api/traces"
