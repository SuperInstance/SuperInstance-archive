apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-frontend
  namespace: swarm-intelligence
  labels:
    app: swarm-frontend
    version: v1
spec:
  replicas: 5
  selector:
    matchLabels:
      app: swarm-frontend
  template:
    metadata:
      labels:
        app: swarm-frontend
        version: v1
    spec:
      containers:
      - name: nginx
        image: ghcr.io/yourusername/swarm-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health.html
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: swarm-frontend
  namespace: swarm-intelligence
  labels:
    app: swarm-frontend
spec:
  type: ClusterIP
  selector:
    app: swarm-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
