apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-core
  namespace: swarm-intelligence
  labels:
    app: swarm-core
    version: v1
spec:
  replicas: 10
  selector:
    matchLabels:
      app: swarm-core
  template:
    metadata:
      labels:
        app: swarm-core
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - swarm-core
              topologyKey: kubernetes.io/hostname
      containers:
      - name: swarm-core
        image: ghcr.io/yourusername/swarm-core:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 50051
          name: grpc
          protocol: TCP
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: postgres.host
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: postgres.port
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: postgres.db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: postgres.user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: postgres.password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: redis.host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: redis.port
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: kafka.brokers
        - name: MAX_AGENTS
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: max.agents
        - name: WORKER_THREADS
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: worker.threads
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: swarm-config
              key: log.level
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: swarm-locks
          mountPath: /var/swarm/locks
        - name: swarm-pheromones
          mountPath: /var/swarm/pheromones
        resources:
          requests:
            cpu: 4000m
            memory: 8Gi
          limits:
            cpu: 8000m
            memory: 16Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
      - name: swarm-locks
        emptyDir: {}
      - name: swarm-pheromones
        emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: swarm-core
  namespace: swarm-intelligence
  labels:
    app: swarm-core
spec:
  type: ClusterIP
  selector:
    app: swarm-core
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
